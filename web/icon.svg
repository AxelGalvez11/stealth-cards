<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.5 -2.75 36 36">
  <!-- The Lucida mark for browser tabs: three dots, two above and one below; black on light tab strips, white on dark ones. -->
  <style>.mark{fill:#000}@media (prefers-color-scheme:dark){.mark{fill:#fff}}</style>
  <g class="mark">
    <circle cx="7" cy="7" r="7"/>
    <circle cx="26" cy="7" r="7"/>
    <circle cx="16.5" cy="23.45" r="7"/>
  </g>
</svg>
