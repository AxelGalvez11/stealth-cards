<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Lucida tab icon: three small white dots on a black rounded tile, so it shows on light and dark tab strips
       alike; in dark mode a faint edge keeps the tile apart from the strip. design/to-site.mjs draws the same one. -->
  <style>.tile{fill:#000;stroke:none}@media (prefers-color-scheme:dark){.tile{stroke:#5A5A5E}}</style>
  <rect class="tile" x="2.5" y="2.5" width="27" height="27" rx="7.5" stroke-width="1.5"/>
  <g fill="#fff" transform="translate(8.41 9) scale(.46)">
    <circle cx="7" cy="7" r="7"/>
    <circle cx="26" cy="7" r="7"/>
    <circle cx="16.5" cy="23.45" r="7"/>
  </g>
</svg>
