<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone · News</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; font-family: Geist, -apple-system, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}; overflow: hidden;">
<div style="height: 100%; overflow-x: hidden; overflow-y: auto; scrollbar-width: none;"><div style="padding: 64px 20px 34px; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; align-items: center; gap: 12px;"><a href="PhoneDiscover.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: {{t.surf}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><div style="flex-grow: 1; font-size: 17px; font-weight: 600; text-align: center;">News</div><div style="width: 44px;"></div></div>
  <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><div aria-label="Loading" style="display: flex; flex-direction: column; gap: 16px;"><div style="width: 280px; height: 34px; border-radius: 12px; background: {{t.surf}};"></div><div style="height: 120px; border-radius: 20px; background: {{t.surf}};"></div><div style="height: 120px; border-radius: 20px; background: {{t.surf}};"></div><div style="height: 120px; border-radius: 20px; background: {{t.surf}};"></div></div></sc-if>
  <sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column;"><sc-for list="{{items}}" as="n" hint-placeholder-count="5"><a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 12px 0; box-sizing: border-box; border-bottom: 1px solid {{t.line}};">
    <sc-if value="{{n.human}}" hint-placeholder-val="{{ true }}"><span style="position: relative; width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; overflow: hidden; background: {{n.who.bg}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; line-height: 1;"><sc-if value="{{n.who.noPhoto}}" hint-placeholder-val="{{ true }}">{{n.who.initial}}</sc-if><sc-if value="{{n.who.hasPhoto}}" hint-placeholder-val="{{ false }}"><img src="{{n.who.photo}}" alt="" referrerpolicy="no-referrer" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;"></sc-if></span></sc-if><sc-if value="{{n.system}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: {{t.inv}}; color: {{t.invText}}; display: inline-flex; align-items: center; justify-content: center;"><svg width="17" height="16" viewBox="0 0 33 30.5" fill="currentColor" aria-hidden="true" style="flex-shrink: 0; display: block;"><circle cx="7" cy="7" r="7"/><circle cx="26" cy="7" r="7"/><circle cx="16.5" cy="23.45" r="7"/></svg></span></sc-if>
    <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 15px; line-height: 1.4;"><span style="font-weight: 600;">{{n.lead}}</span> {{n.mid}} <span style="font-weight: 600;">{{n.tail}}</span><sc-if value="{{n.isNew}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: -9999px;">New</span></sc-if></span>
      <sc-if value="{{n.hasNote}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{n.note}}</span></sc-if>
    </span>
    <span style="flex-shrink: 0; font-size: 12px; color: {{t.muted}};">{{n.when}}</span>
    <span aria-hidden="true" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background: {{n.dot}};"></span>
  </a></sc-for></div></sc-if>
  <sc-if value="{{nothing}}" hint-placeholder-val="{{ false }}"><div style="padding: 40px 20px; border-radius: 22px; background: {{t.surf}}; text-align: center; font-size: 15px; color: {{t.muted}};">Nothing new</div></sc-if>
  <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}"><div style="padding: 40px 20px; border-radius: 22px; background: {{t.surf}}; text-align: center; font-size: 15px; color: {{t.muted}};">Couldn’t reach Lucida. Check your connection.</div></sc-if>
</div></div>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"loading":{"editor":"boolean","default":false},"empty":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends LucidaLogic(DCLogic, 0) {

componentWillUnmount() { clearTimeout(this.readT); }
renderVals() {
  const t = this.theme(!!this.props.dark, !!this.props.dim);const db = this.props.db || this.mock(); const chrome = db.chrome();const PC = ["linear-gradient(135deg, #8C9AFC 0%, #4F60E6 100%)","linear-gradient(135deg, #FFC857 0%, #EE5A36 100%)","linear-gradient(135deg, #7EE0B0 0%, #1F8F5F 100%)","linear-gradient(135deg, #F9A8D4 0%, #D6336C 100%)","linear-gradient(135deg, #7DE3F0 0%, #0E8A9E 100%)","linear-gradient(135deg, #C4A7FF 0%, #7C3AED 100%)"];
  const goTo = (url, board) => (db.mock ? board + '.dc.html' : url || '/');
  const person = p => { p = p || {}; const nm = String(p.name || ''); return { name: nm, handle: p.handle || '', at: p.handle ? '@' + p.handle : '', href: goTo(p.handle ? '/@' + p.handle : '', 'WebProfile'),
    initial: ((nm.trim() || '?')[0]).toUpperCase(), bg: PC[p.color || 0] || PC[0], photo: p.avatar || '', hasPhoto: !!p.avatar, noPhoto: !p.avatar,
    teacher: p.verified === 'teacher', school: p.verified === 'school' || p.kind === 'school', verified: !!p.verified }; };
  const kfmt = n => { n = +n || 0; return n >= 10000 ? Math.round(n / 1000) + 'k' : n >= 1000 ? (Math.round(n / 100) / 10 + 'k').replace('.0k', 'k') : String(n); };
  const MONTHS3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const ago = iso => { const t = Date.parse(iso || ''); if (!t) return ''; const m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (db.mock) { const d = new Date(t); return MONTHS3[d.getUTCMonth()] + ' ' + d.getUTCDate(); }
    if (m < 1) return 'Just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return h + 'h ago'; const dd = Math.round(h / 24); if (dd === 1) return 'Yesterday'; if (dd < 7) return dd + ' days ago';
    const d = new Date(t); return MONTHS3[d.getMonth()] + ' ' + d.getDate(); };
  const netDeck = d => { d = d || {}; const cv = d.cover || {}, pal = this.gen((cv.seed || d.name || 'Lucida') + (cv.round ? ' #' + cv.round : ''), cv.style || 'mix'), photo = cv.image && cv.image !== 'mock' ? cv.image : '';
    const badge = d.checked ? 'Checked' : d.owner && (d.owner.kind === 'school' || d.owner.verified === 'school') ? 'Official · ' + d.owner.name : d.pinned ? 'Pinned' : '';
    const cardsLine = kfmt(d.cards) + (d.cards === 1 ? ' card' : ' cards');
    return { ...pal, id: d.id || '', name: d.name || '', href: goTo(d.url, 'WebPublicDeck'), stats: kfmt(d.stars) + '   ' + cardsLine, cardsLine, stars: kfmt(d.stars),
      owner: person(d.owner), photo, hasPhoto: !!photo, badge, hasBadge: !!badge, badgeShield: !!d.checked || (!!d.owner && d.owner.kind === 'school') }; };
  const B = n => 'Phone' + n;
  const data = db.net.activity(), bad = !!(data && (data.missing || data.offline)), list = (data && !bad && data.items) || [];
  // What was new when you opened the page keeps its dot while you're here, though it's marked read (and the bell's
  // count goes) a moment after you open it.
  if (data && !bad && !this.fresh) this.fresh = new Set(list.filter(x => !x.read).map(x => x.id));
  if (data && !bad && data.unread && !db.mock && !this.readT) this.readT = setTimeout(() => Promise.resolve(db.act.readNews()).catch(() => {}), 1500);
  const lib = db.mock ? [] : db.decks();
  const items = list.map(x => {
    const d = x.data || {}, dk = x.deck || {}, n = +d.n || 0, took = +d.took || 0, skipped = +d.skipped || 0;
    const who = person(x.person || { name: x.actor_name }), actor = x.actor_name || who.name || 'Someone';
    const did = took && skipped ? 'took ' + took + ' of your changes to' : took ? (took === 1 ? 'took your change to' : 'took your ' + took + ' changes to') : skipped === 1 ? 'skipped your change to' : 'skipped your changes to';
    const words = { suggestion: [actor, 'suggested ' + (n === 1 ? 'a change' : n + ' changes') + ' to', dk.name || ''], follow: [actor, 'followed you', ''],
      update: [dk.name || 'A deck you follow', 'has ' + (d.summary || 'changes'), ''], decided: [actor, did, dk.name || ''], checked: [actor, 'checked', dk.name || ''],
      verified: ['You’re verified', 'as a ' + (d.role === 'school' ? 'school' : 'teacher'), ''], hidden: [dk.name || d.name || 'A deck of yours', 'was hidden after a report', ''] }[x.kind] || [actor, '', dk.name || ''];
    // A suggestion opens your deck's suggestions (your library's deck shared as that one), or for a helper (the deck isn't
    // theirs) their Suggestions, where every deck they help with waits; a follow, their profile.
    const mine = x.kind === 'suggestion' && dk.id ? lib.find(y => y.shared && y.shared.id === dk.id) : null;
    // Lucida's own news (verified, hidden) has no person: it shows Lucida's mark. Being verified opens your profile (where
    // the check is); a hidden deck opens its page.
    const href = x.kind === 'follow' ? goTo('/@' + (who.handle || d.handle || ''), B('ProfileOther')) : x.kind === 'verified' ? goTo('/you', B('Profile')) : mine ? goTo('/deck/' + mine.id + '/suggestions', B('Suggestions'))
      : x.kind === 'suggestion' ? goTo('/suggestions', B('Suggestions')) : goTo(dk.url || '', B('PublicDeck'));
    const isNew = !x.read || (!!this.fresh && this.fresh.has(x.id)), system = x.kind === 'verified' || x.kind === 'hidden';
    return { id: String(x.id), who, system, human: !system, lead: words[0], mid: words[1], tail: words[2], hasNote: x.kind === 'suggestion' && !!d.message, note: d.message || '', when: ago(x.created_at), isNew, dot: isNew ? '#3E63DD' : 'transparent', href };
  });
  return { t, ...chrome, grain: String(this.props.grain ?? 0.7), signedIn: !db.signedOut && !this.props.signedOut, signedOutView: !!db.signedOut || !!this.props.signedOut, homeHref: db.mock ? 'Landing.dc.html' : 'https://lucida.cards/', signInHref: db.mock ? 'WebSignIn.dc.html' : '/sign-in?next=' + encodeURIComponent(location.pathname), loading: data === undefined, offline: bad, items, hasItems: items.length > 0, nothing: !!data && !bad && !items.length };
}
}
</script>
</body>
</html>
