@import url("./lucida.css");
.sc-rich[data-empty="true"]::before{content:attr(data-ph);position:absolute;color:var(--ph);pointer-events:none}.sc-wave{outline:0;-webkit-tap-highlight-color:transparent}.sc-wave:focus-visible{box-shadow:0 0 0 2px currentColor;border-radius:8px}.sc-wave span{transition:height .35s cubic-bezier(.2,.8,.2,1)}button:has(.sc-hold:active,.sc-wave:active){transform:none}@keyframes scRecDot{50%{opacity:.25}}.sc-rec-dot{animation:scRecDot 1.2s ease-in-out infinite}@keyframes scPlayed{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}@media (prefers-reduced-motion:reduce){.sc-wave span{transition:none}.sc-rec-dot{animation:none}}.sc-occ-h::before,.sc-occ-x::before{content:"";position:absolute;inset:-5px}@media (pointer:coarse){.sc-occ-h[data-occ-h=nw]::before{inset:-16px -3px -3px -16px}.sc-occ-h[data-occ-h=sw]::before{inset:-3px -3px -16px -16px}.sc-occ-h[data-occ-h=se]::before{inset:-3px -16px -16px -3px}.sc-occ-x::before{inset:-10px}}.sc-occ-pic:focus-visible{outline:2px solid currentColor;outline-offset:5px}.sc-card-row[aria-current="false"]:hover{background-color:color-mix(in srgb,currentColor 4%,transparent)!important}.sc-card-row:active{transform:scale(.985)}@media (prefers-reduced-motion:reduce){.sc-card-row:active{transform:none}}
