<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top tabs · Deck</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; font-family: Geist, -apple-system, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}; overflow: hidden;">
<header style="height: 76px; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center;">
  <div style="width: 240px;"><div style="display: flex; align-items: center; gap: 9px;"><svg width="14" height="13" viewBox="0 0 33 30.5" fill="currentColor" aria-hidden="true" style="flex-shrink: 0; display: block;"><circle cx="7" cy="7" r="7"/><circle cx="26" cy="7" r="7"/><circle cx="16.5" cy="23.45" r="7"/></svg><div style="font-size: 17px; font-weight: 600; letter-spacing: -.02em;">Lucida</div></div></div>
  <nav style="flex-grow: 1; display: flex; justify-content: center;"><div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: {{t.surf}};">
    <a href="TopToday.dc.html" style="height: 38px; padding: 0 20px; display: flex; align-items: center; border-radius: 999px; font-size: 14px; font-weight: 500; color: {{t.muted}};">Today</a><a href="TopDeck.dc.html" style="height: 38px; padding: 0 20px; display: flex; align-items: center; border-radius: 999px; font-size: 14px; font-weight: 500; background: {{t.bg}}; color: {{t.text}}; box-shadow: 0 1px 3px rgba(0,0,0,.12);">Decks</a><a href="TopToday.dc.html" style="height: 38px; padding: 0 20px; display: flex; align-items: center; border-radius: 999px; font-size: 14px; font-weight: 500; color: {{t.muted}};">Stats</a><a href="TopToday.dc.html" style="height: 38px; padding: 0 20px; display: flex; align-items: center; border-radius: 999px; font-size: 14px; font-weight: 500; color: {{t.muted}};">Connect</a>
  </div></nav>
  <div style="width: 240px; display: flex; justify-content: flex-end; gap: 8px;"><button type="button" aria-label="Search" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: {{t.surf}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><span style="width: 40px; height: 40px; border-radius: 20px; background: {{t.surf2}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;">A</span></div>
</header>
<main style="flex-grow: 1; display: flex; justify-content: center; padding-top: 32px;">
  <div style="width: 680px; display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
      <h1 style="margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.04em; line-height: 1;">Cell Biology</h1>
      <div style="font-size: 15px; color: {{t.muted}};">28 due · 10 new · 91% remembered · 412 cards</div>
      <div style="display: flex; gap: 10px; padding-top: 8px;"><a href="WebCardsScreenNew.dc.html" class="sc-press" style="height: 52px; padding: 0 22px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; border: 0; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{t.surf}}; color: {{t.text}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add card</a><a href="WebReview.dc.html" style="height: 52px; padding: 0 36px; border-radius: 999px; background: {{t.inv}}; color: {{t.invText}}; display: inline-flex; align-items: center; font-size: 16px; font-weight: 600;">Study now</a></div>
    </div>
    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 14px; height: 64px; border-bottom: 1px solid {{t.line}};"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;"><span style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.front}}</span><span style="font-size: 13px; color: {{t.muted}};">{{r.kind}} · {{r.next}}</span></span></div>
      </sc-for>
    </div>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends LucidaLogic(DCLogic, 0) {
renderVals() { const t = this.theme(!!this.props.dark, !!this.props.dim); return { t, rows: [
  { front: 'What does the electron transport chain pump across the inner membrane?', back: 'Protons (H⁺)', kind: 'Basic', icon: 'text', next: 'Tomorrow', ai: '', tags: ['Energy', 'Exam 1', 'Mitochondria', 'Must know'] },
  { front: 'The ____ is the powerhouse of the cell.', back: 'mitochondrion', kind: 'Fill in the blank', icon: 'blank', next: 'Due now', ai: 'Claude', tags: ['Organelles', 'Exam 1'] },
  { front: 'Name structure 1 on the diagram.', back: 'Nucleus', kind: 'Image', icon: 'image', next: 'In 3 days', ai: 'Claude', tags: ['Organelles', 'Diagrams'] },
  { front: 'Which organelle packages proteins for secretion?', back: 'Golgi apparatus', kind: 'Basic', icon: 'text', next: 'In 6 days', ai: '', tags: ['Organelles'] },
  { front: 'Say it: ribosome', back: 'RY-buh-sohm', kind: 'Audio', icon: 'audio', next: 'Due now', ai: 'ChatGPT', tags: ['Pronunciation'] },
  { front: 'What is the role of the ribosome?', back: 'Translates mRNA into protein', kind: 'Basic', icon: 'text', next: 'In 12 days', ai: '', tags: ['Proteins', 'Exam 2'] }
] }; }
}
</script>
</body>
</html>
