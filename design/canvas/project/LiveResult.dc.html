<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live · phone · right</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");
@keyframes scTimer{from{stroke-dashoffset:0}to{stroke-dashoffset:1}}@keyframes scTime{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes scJoin{from{opacity:0;transform:scale(.6)}}@keyframes scBar{from{transform:scaleX(0)}}@keyframes scRiseUp{from{opacity:0;transform:translateY(40px)}}@keyframes scFloat2{50%{transform:translateY(-6px)}}@keyframes scPop{from{transform:scale(0)}}@keyframes scDealR{from{opacity:0;transform:translate(40px,30px)}}@keyframes scDealL{from{opacity:0;transform:translate(-30px,30px)}}@keyframes scLiftIn{from{transform:none}to{transform:translateY(-10px)}}@keyframes scHover{from{transform:translateY(-10px)}to{transform:translateY(-15px)}}@media (prefers-reduced-motion:reduce){.sc-occ{transition:none!important}}@media (prefers-reduced-motion:reduce){.sc-live *{animation:none!important}}@keyframes scFlame{0%,100%{transform:rotate(-3deg) scale(1,1)}25%{transform:rotate(2deg) scale(1.05,.96)}50%{transform:rotate(-1deg) scale(.97,1.06)}75%{transform:rotate(3deg) scale(1.02,.99)}}@keyframes scFlameCore{0%,100%{transform:scale(1,1);opacity:1}50%{transform:scale(.86,1.14);opacity:.82}}
</style>
</helmet>
<div class="sc-live sc-live-phone" style="position: relative; isolation: isolate; width: 390px; height: 844px; box-sizing: border-box; font-family: Geist, -apple-system, system-ui, sans-serif; background: #7ACFEA; color: #0D1542; overflow: hidden; padding: 64px 24px 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; background: {{r.bg}};">
  <div style="position: relative; width: 310px; height: 236px; flex-shrink: 0;">
    <sc-if value="{{r.wrong}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: -4px; top: 58px; width: 158px; height: 168px; box-sizing: border-box; padding: 18px; border-radius: 28px; background: #C4CBD5; color: #5D6677; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; animation: scDealL .5s cubic-bezier(.2,.8,.2,1) both;"><span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #0D1542; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span style="max-width: 100%; font-size: {{r.pickFs}}; font-weight: 700; line-height: 1.12; hyphens: auto; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;">{{r.pick}}</span></div></sc-if>
    <div style="position: absolute; left: {{r.cardX}}; top: 12px; width: 188px; height: 196px; box-sizing: border-box; padding: 20px; border-radius: 30px; background: #FFFFFF; box-shadow: 0 26px 48px -20px rgba(13,21,66,.5); display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; transform: translateY(-8px); animation: scDealR .55s cubic-bezier(.2,.8,.2,1) .1s backwards, scHover 2.4s ease-in-out 1.1s infinite alternate;"><span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; background: #16C64A; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span><span style="max-width: 100%; font-size: {{r.answerFs}}; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; hyphens: auto; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;">{{r.answer}}</span></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px;"><div style="font-size: 40px; font-weight: 700; letter-spacing: -.03em;">{{r.title}}</div><div style="font-size: 18px; font-weight: 600; overflow-wrap: anywhere;">{{r.line}}</div></div>
  <sc-if value="{{r.flame}}" hint-placeholder-val="{{ true }}"><span style="height: 40px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 10px 24px -16px rgba(13,21,66,.35); font-size: 15px; font-weight: 700;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; overflow: visible; filter: drop-shadow(0 1px 2px rgba(238,90,54,.35));"><defs><linearGradient id="sc-flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB03B"/><stop offset=".55" stop-color="#F7792A"/><stop offset="1" stop-color="#EE5A36"/></linearGradient></defs><g class="sc-flame" style="transform-origin: 12px 21px; animation: scFlame 1.6s ease-in-out infinite;"><path fill="url(#sc-flame)" d="M12 2C12.8 5.2 15 7.1 16.7 9.1C18.2 10.9 19 12.9 19 15.2C19 19.1 15.9 22 12 22C8.1 22 5 19.1 5 15.4C5 13.1 5.9 11.2 7.5 9.7C7.7 11.2 8.4 12.3 9.5 12.9C9.2 9.1 10.1 5.6 12 2Z"/><path fill="#FFD25E" style="transform-origin: 12px 21.6px; animation: scFlameCore .9s ease-in-out infinite;" d="M12 11.5C12.5 13.4 13.8 14.5 14.7 15.7C15.3 16.5 15.6 17.3 15.6 18.2C15.6 20.2 14 21.6 12 21.6C10 21.6 8.4 20.2 8.4 18.3C8.4 16.9 9.1 15.8 10.2 15C10.3 15.8 10.7 16.4 11.3 16.7C11.1 14.9 11.4 13.1 12 11.5Z"/></g></svg><span>{{r.streakLine}}</span></span></sc-if>
  <span style="font-size: 16px; color: rgba(13,21,66,.68);">{{r.place}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"wrong":{"editor":"boolean","default":false},"timeUp":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends LucidaLogic(DCLogic, 0) {

constructor(props) { super(props); this.state = { codeFocus: false }; }
renderVals() {
  const t = this.theme(false, false), db = this.props.db || this.mock(), P = this.props;
  const studyBg = (dk, dark, dim, S, phone) => {
    const b = (dk && dk.bg) || {}, img = b.image || (dk && dk.image) || '';
    const kind = ['deck', 'plain', 'sky', 'sunset', 'photo'].includes(b.kind) && !(b.kind === 'photo' && !img) ? b.kind : 'deck';
    const mesh = this.gen(((dk && dk.seed) || 'Lucida') + (dk && dk.round ? ' #' + dk.round : ''), (dk && dk.style) || 'mix');
    const skin = !!S && kind === 'deck';
    // On the canvas a photo is a placeholder, so it shows the deck's colors at full strength instead.
    const photo = kind === 'photo' && img !== 'mock' ? img : '', sample = kind === 'photo' && !photo, faint = kind === 'deck' && !skin, gray = dark && dim;
    // In light mode the deck's colors are one pale hue (the owner: "make the background for flashcards and learn be
    // monochrome and lighter/fainter on light mode"): every fold of its gradient in the deck's main color (the middle of
    // the gradient), light and soft, a pastel wash under the words. Dark and gray keep theirs.
    const mono = faint && !dark, hue = parseInt(mesh.base.split('hsl(')[2]) || 0;
    const pale = c => c.replace(/hsl\((\d+) (\d+)% (\d+)%\)/g, (_, h, s, l) => 'hsl(' + hue + ' 50% ' + Math.round(84 + l * .12) + '%)');
    return { isDeck: faint || sample, isPhoto: !!photo, isSky: kind === 'sky', isSunset: kind === 'sunset', photo, skin, art: skin ? S.bg(!!phone) : null, dark: skin ? S.dark : dark,
      mesh: mono ? Object.fromEntries(Object.entries(mesh).map(([k, v]) => [k, typeof v === 'string' ? pale(v) : v && v.c ? { ...v, c: pale(v.c) } : v])) : mesh,
      filter: sample || !dark ? 'none' : gray ? 'saturate(.16) brightness(.34)' : 'saturate(.16) brightness(.42)',
      veil: faint ? (gray ? 'rgba(30,30,32,.45)' : dark ? 'rgba(0,0,0,.3)' : 'rgba(255,255,255,.35)') : photo || sample ? (gray ? 'rgba(30,30,32,.55)' : dark ? 'rgba(0,0,0,.5)' : 'rgba(255,255,255,.38)') : 'rgba(0,0,0,0)',
      skyTop: gray ? '#1B2A48' : dark ? '#081733' : '#86BDF3', skyMid: gray ? '#1F2B45' : dark ? '#0D2148' : '#C9E2FB', skyLow: gray ? '#212637' : dark ? '#0A1530' : '#EDF5FE',
      sunset: gray ? "radial-gradient(90% 60% at 88% 100%, rgba(238,142,98,.18), rgba(238,142,98,0) 70%), linear-gradient(180deg, #1F2638 0%, #272C40 35%, #332C3F 65%, #3E2E37 100%)" : dark ? "radial-gradient(90% 60% at 88% 100%, rgba(238,142,98,.16), rgba(238,142,98,0) 70%), linear-gradient(180deg, #0C1426 0%, #151B31 35%, #231C2E 65%, #2E1D25 100%)" : "radial-gradient(90% 60% at 88% 100%, rgba(238,142,98,.22), rgba(238,142,98,0) 70%), linear-gradient(180deg, #C3D3E3 0%, #D3DBE6 30%, #E6DDE4 52%, #F2DCD8 72%, #F5CFC2 100%)", grain: faint || sample || kind === 'sunset' ? '.55' : '0' };
  };
  const LVc = {"blue":"#7ACFEA","green":"#62DE8A","yellow":"#FFD84A","navy":"#0D1542","ink2":"rgba(13,21,66,.68)","chip":"rgba(255,255,255,.55)","check":"#16C64A","gray":"#C4CBD5","grayInk":"#5D6677","purple":"#4F60E6","shadow":"0 10px 24px -16px rgba(13,21,66,.35)","lift":"0 26px 48px -20px rgba(13,21,66,.5)"}, VIVID = ["Live answer 9","Live answer 86","Live answer 34","Live answer 5"], colors = ["#4F60E6","#F2701D","#12A150","#E5407E","#0D1542"];
  const J = db.join(), me = J.me, F = J.form, q = J.q, act = fn => e => { if (db.mock) return; if (e && e.preventDefault) e.preventDefault(); fn(); };
  const nth = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  const pts = n => n === 1 ? '1 point' : n.toLocaleString('en-US') + ' points';
  const initial = name => (String(name || '')[0] || '?').toUpperCase();
  // Joining: the six boxes show the code as it's typed, the next one ringed while the field has focus.
  const code = F.code, focus = !!this.state.codeFocus;
  const boxes = [0, 1, 2, 3, 4, 5].map(i => ({ digit: code[i] || '', ring: LVc.shadow + (focus && i === Math.min(code.length, 5) ? ', inset 0 0 0 2px ' + LVc.purple : '') }));
  const go = () => { if (!db.mock) db.act.joinLive(); };
  // Answering: a tap locks it in; the time running out ends it.
  const picked = J.pick != null, over = !db.mock && J.timer.left <= 0, long = Math.max(0, ...q.options.map(o => String(o).length));
  const opt = i => { const show = i < q.options.length, mine = picked && J.pick === i, faded = (picked && !mine) || (over && !picked), p = this.gen(VIVID[i], 'vivid');
    return { p, show, label: show ? q.options[i] : '', mine, shape: !mine, pressed: mine ? 'true' : 'false', fg: p.ink, ts: p.shadow, badge: mine ? LVc.check : p.glass, badgeLine: mine ? 'none' : 'inset 0 0 0 1.5px ' + p.glassLine,
      shadow: faded ? 'none' : LVc.shadow, gfilter: faded ? 'grayscale(1)' : 'none', op: faded ? '.45' : '1', cursor: picked || over ? 'default' : 'pointer', pick: () => { if (!picked && !over) db.act.liveAnswer(i); } }; };
  // After each question: right, not quite, or time's up, and where you stand.
  // A right answer also says how far behind the next one up you are (the owner's sample: "You're in 2nd place, 140
  // points behind Maya").
  const R = J.result, rows = J.standings, rank = me.rank, ahead = rank > 1 ? rows[rank - 2] : null, gap = ahead ? ahead.score - rows[rank - 1].score : 0, timeUp = R.timeUp, wrong = !R.ok && !timeUp;
  const place = !rank ? '' : 'You’re in ' + nth(rank) + ' place' + (R.ok && gap > 0 ? ', ' + pts(gap) + ' behind ' + ahead.name : '');
  // The end: the top three on the podium (you're marked), then everyone else.
  const podium = [1, 0, 2].filter(i => rows[i]).map(i => { const p = rows[i], you = p.id === me.id;
    return { place: String(i + 1), name: you ? 'You' : p.name, initial: initial(p.name), color: colors[p.color % 5], score: p.score.toLocaleString('en-US'), h: [120, 88, 64][i] + 'px', label: (i + 1) + '. ' + (you ? 'You' : p.name) + ', ' + pts(p.score),
      bg: [LVc.navy, LVc.purple, LVc.blue][i], fg: i === 2 ? LVc.navy : '#FFFFFF', ring: you ? '0 0 0 3px #FFFFFF, 0 0 0 5px ' + LVc.navy : 'none', delay: [.6, .3, 0][i] + 's' }; });
  const rest = rows.slice(3);
  const late = J.phase === 'late';
  // The cards after an answer are narrow: a long word gets smaller type instead of breaking.
  const word = x => Math.max(0, ...String(x || '').split(/\s+/).map(w => w.length));
  const fit = (x, sizes, fits) => sizes[fits.findIndex(n => word(x) <= n)] || sizes[sizes.length - 1];
  return { t, bg: studyBg(J.deck, false, false), grain: String(this.props.grain ?? 0.7), deckName: J.deck.name,
    // Joining
    code, boxes, name: F.name, error: F.error, joinLabel: F.busy ? 'Joining…' : 'Join', joinOp: F.busy ? '.6' : '1',
    setCode: e => db.act.joinCode(e && e.target ? e.target.value : ''), setName: e => db.act.joinName(e && e.target ? e.target.value : ''),
    codeIn: () => this.setState({ codeFocus: true }), codeOut: () => this.setState({ codeFocus: false }),
    codeKey: e => { if (e.key === 'Enter') { e.preventDefault(); go(); } }, nameKey: e => { if (e.key === 'Enter') { e.preventDefault(); go(); } },
    join: act(() => db.act.joinLive()),
    // Waiting
    meName: me.name, meInitial: initial(me.name), meColor: colors[(me.color || 0) % 5], meScore: me.score.toLocaleString('en-US'),
    waitTitle: 'You’re in, ' + me.name + '!', waitLine: late ? 'You’ll play from the next question.' : 'Look for your name on the big screen. The game starts soon.',
    // Answering
    nOf: J.n + ' of ' + J.of, qText: q.text, qSizeP: (q.text.length > 160 ? 19 : q.text.length > 90 ? 22 : 28) + 'px', tileFsP: (long > 70 ? 15 : long > 40 ? 17 : 21) + 'px',
    rows: 'repeat(' + Math.max(2, q.options.length) + ', minmax(0, 1fr))', o0: opt(0), o1: opt(1), o2: opt(2), o3: opt(3),
    bar: { left: J.timer.left + 's', frac: String(J.timer.frac), anim: db.mock ? 'scTime ' + J.timer.dur + 's linear -6s infinite' : 'scTime ' + J.timer.dur + 's linear ' + J.timer.delay + 's both' },
    // The answer
    r: { right: R.ok, wrong, flame: R.ok && R.streak >= 2, streakLine: R.streak + ' in a row', bg: R.ok ? 'linear-gradient(180deg, #A3E8BC 0%, #D0F5DD 45%, #EEFCF3 75%, #FFFFFF 100%)' : 'linear-gradient(180deg, #FFE08A 0%, #FFF0C2 45%, #FFF9E8 75%, #FFFFFF 100%)', title: R.ok ? 'Right!' : timeUp ? 'Time’s up' : 'Not quite',
      line: R.ok ? '+' + pts(R.gained) : 'It was ' + R.answer + '.', place, pick: R.pick, answer: R.answer, cardX: wrong ? '134px' : '61px',
      answerFs: fit(R.answer, ['24px', '20px', '18px', '16px'], [10, 12, 14]), pickFs: fit(R.pick, ['22px', '19px', '17px', '15px'], [9, 11, 12]) },
    // The end
    f: { title: rank ? 'You placed ' + nth(rank) + '!' : 'Final results', line: pts(me.score) + ' · ' + me.right + ' of ' + me.played + ' right', podium, hasRest: rest.length > 0, promo: !!J.promo,
      rest: rest.map((p, i) => ({ rank: String(i + 4), name: p.id === me.id ? 'You' : p.name, weight: p.id === me.id ? '700' : '600', initial: initial(p.name), score: p.score.toLocaleString('en-US'), color: colors[p.color % 5], line: i < rest.length - 1 ? 'inset 0 -1px 0 rgba(13,21,66,.08)' : 'none', delay: (.8 + Math.min(i, 8) * .08).toFixed(2) + 's' })) },
    again: act(() => db.act.joinAgain()) };
}
}
</script>
</body>
</html>
