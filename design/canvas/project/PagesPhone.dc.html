<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone · Deck › Pages (design)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 52px 16px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; font-family: Geist, -apple-system, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}};">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px;"><span style="height: 36px; flex-shrink: 0; box-sizing: border-box; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; padding: 0 10px; background: {{t.surf}}; color: {{t.text}};"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Library</span></div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.03em;">Cell Biology</h1>
    <div style="display: flex; align-items: center; gap: 8px;"><div role="tablist" aria-label="Deck" style="display: flex; gap: 4px;"><sc-for list="{{tabs}}" as="x" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{x.on}}" style="height: 36px; flex-shrink: 0; box-sizing: border-box; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; height: 34px; background: {{x.bg}}; color: {{x.fg}};">{{x.name}}</button></sc-for></div><span style="flex-grow: 1;"></span><div style="position: relative; flex-shrink: 0;"><button type="button" onClick="{{toggleMenu}}" aria-haspopup="menu" aria-expanded="{{menuExpanded}}" class="sc-press" style="height: 36px; flex-shrink: 0; box-sizing: border-box; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: {{t.inv}}; color: {{t.invText}};"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New page</button><sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}"><div role="menu" aria-label="New page" data-sc-pop style="position: absolute; right: 0; top: calc(100% + 8px); z-index: 50; width: 320px; box-sizing: border-box; padding: 6px; border-radius: 18px; background: {{t.bg}}; box-shadow: 0 0 0 1px {{t.line}}, 0 18px 44px rgba(0,0,0,.22); display: flex; flex-direction: column; gap: 2px;">
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="6"><button type="button" role="menuitem" style="min-height: 52px; padding: 6px 10px; display: flex; align-items: center; gap: 12px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; text-align: left; cursor: pointer;"><span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; background: {{t.surf}}; display: flex; align-items: center; justify-content: center;"><sc-if value="{{k.is_note}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M12 6v13"/></svg></sc-if><sc-if value="{{k.is_slides}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></sc-if><sc-if value="{{k.is_mindmap}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8.4 11.1 16 6.9M8.6 12h7.4M8.4 12.9 16 17.1"/></svg></sc-if><sc-if value="{{k.is_diagram}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></sc-if><sc-if value="{{k.is_canvas}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></sc-if><sc-if value="{{k.is_doc}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></sc-if></span><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0;"><span style="font-size: 14px; font-weight: 600;">{{k.name}}</span><span style="font-size: 12px; color: {{t.muted}};">{{k.line}}</span></span></button></sc-for>
      <div style="margin: 4px 6px 4px; padding: 10px 4px 4px; border-top: 1px solid {{t.line}}; display: flex; gap: 8px; font-size: 12px; line-height: 1.45; color: {{t.muted}};"><span style="flex-shrink: 0;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg></span><span>Your AI can make any of these too: ask it in Claude or ChatGPT once Lucida is connected.</span></div>
    </div></sc-if></div></div>
    <div style="display: flex; flex-direction: column; border-top: 1px solid {{t.line}};"><sc-for list="{{rows}}" as="r" hint-placeholder-count="5"><button type="button" style="width: 100%; min-height: 64px; box-sizing: border-box; padding: 8px 0 8px {{r.indent}}; display: flex; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid {{t.line}}; background: transparent; color: {{t.text}}; font: inherit; text-align: left; cursor: pointer;">
      <span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 17px; background: {{t.surf}}; display: flex; align-items: center; justify-content: center;"><sc-if value="{{r.is_note}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M12 6v13"/></svg></sc-if><sc-if value="{{r.is_slides}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></sc-if><sc-if value="{{r.is_mindmap}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8.4 11.1 16 6.9M8.6 12h7.4M8.4 12.9 16 17.1"/></svg></sc-if><sc-if value="{{r.is_diagram}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></sc-if><sc-if value="{{r.is_canvas}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></sc-if><sc-if value="{{r.is_doc}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></sc-if></span>
      <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.title}}</span><span style="font-size: 13px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.sub}}</span></span>
      <sc-if value="{{r.showMeta}}" hint-placeholder-val="{{ true }}"><span style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{t.muted}};"><sc-if value="{{r.ai}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg></span></sc-if><span>{{r.who}} · {{r.when}}</span><span style="height: 22px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 11px; background: {{t.surf}}; font-size: 12px; font-weight: 600; color: {{t.text}};">v{{r.v}}</span></span></sc-if>
    </button></sc-for></div><sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}"><div style="margin-top: 24px; padding: 28px 20px; border-radius: 24px; background: {{t.surf}}; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
      <span style="font-size: 17px; font-weight: 600;">No pages yet</span>
      <span style="max-width: 420px; font-size: 14px; line-height: 1.5; color: {{t.muted}};">Notes, slides, mind maps and more, beside the cards. Make one here, or ask your AI: “Make a mind map of this deck in Lucida.”</span>
    </div></sc-if>
  </div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"view":{"editor":"enum","default":"List","options":["List","New page menu","Empty deck"]},"$preview":{"width":390,"height":844}}'>
class Component extends LucidaLogic(DCLogic, 0) {

constructor(props) { super(props); this.state = { menu: null }; }
renderVals() {
  const t = this.theme(!!this.props.dark, !!this.props.dim);const db = this.props.db || this.mock(); const chrome = db.chrome();
  const p = this.props, view = p.view || 'List', none = view === 'Empty deck', is = kind => Object.fromEntries(["note","slides","mindmap","diagram","canvas","doc"].map(x => ['is_' + x, x === kind]));
  const open = this.state.menu === null ? view === 'New page menu' : this.state.menu, KIND = {"note":"Note","slides":"Presentation","mindmap":"Mind map","diagram":"Diagram","canvas":"Canvas","doc":"Doc"};
  const rows = none ? [] : [{"kind":"note","title":"Guide","who":"Claude","ai":true,"when":"2 min ago","v":7,"depth":0},{"kind":"note","title":"Cellular respiration","who":"You","ai":false,"when":"Yesterday","v":12,"depth":1},{"kind":"mindmap","title":"The cell at a glance","who":"Claude","ai":true,"when":"Yesterday","v":3,"depth":1},{"kind":"slides","title":"Exam 5 review","who":"ChatGPT","ai":true,"when":"Mon","v":2,"depth":0},{"kind":"diagram","title":"Electron transport chain","who":"Claude","ai":true,"when":"Mon","v":5,"depth":0},{"kind":"doc","title":"Lecture 14 slides.pdf","who":"You","ai":false,"when":"Sep 30","v":1,"depth":0}].map(r => ({ ...r, ...is(r.kind), sub: KIND[r.kind] + (r.kind === 'note' && r.depth ? ' · inside Guide' : ''), indent: (r.depth * 28) + 'px', showMeta: true }));
  return { t, ...chrome, rows, isEmpty: none, kinds: [{"kind":"note","name":"Note","icon":"text","line":"Headings, callouts, chains, tables, toggles and cards"},{"kind":"slides","name":"Presentation","icon":"play","line":"Slides to present, or save as a PDF"},{"kind":"mindmap","name":"Mind map","icon":"mindmap","line":"One idea in the middle, branches you can fold"},{"kind":"diagram","name":"Diagram","icon":"share","line":"Boxes and arrows, laid out for you"},{"kind":"canvas","name":"Canvas","icon":"grid","line":"A board to pin notes, cards and pictures on"},{"kind":"doc","name":"Doc","icon":"file","line":"A PDF to read beside the cards"}].map(k => ({ ...k, ...is(k.kind) })),
    menuOpen: open, menuExpanded: open ? 'true' : 'false', toggleMenu: () => this.setState({ menu: !open }),
    tabs: ['Cards', 'Pages', 'Sources'].map(n => ({ name: n, on: n === 'Pages' ? 'true' : 'false', bg: n === 'Pages' ? t.surf : 'transparent', fg: n === 'Pages' ? t.text : t.muted })) };
}
}
</script>
</body>
</html>
