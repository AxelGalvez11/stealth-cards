0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>

  <div style="position: absolute; left: 50%; top: 150px; width: 640px; height: 400px; margin-left: -320px;">
  <div style="position: absolute; inset: 0; transform: translateY(28px) scale(.9); border-radius: 36px; background: {{t.surf2}};"></div>
  <div style="position: absolute; inset: 0; transform: translateY(14px) scale(.95); border-radius: 36px; background: {{t.surf}}; border: 1px solid {{t.line}};"></div>
  <a href="WebReview.dc.html" style="position: absolute; inset: 0; box-sizing: border-box; padding: 40px 48px; border-radius: 36px; background: {{t.card}}; border: 1px solid {{t.line}}; box-shadow: {{t.shadow}}; display: flex; flex-direction: column; justify-content: space-between;">

  <div style="position: absolute; inset: 0; background: {{t.dim}};"></div>
  <div style="position: absolute; left: 50%; bottom: 16px; width: 720px; margin-left: -360px; box-sizing: border-box; padding: 12px 24px 24px; border-radius: 36px; background: {{t.bg}}; box-shadow: 0 24px 64px rgba(0,0,0,.24); display: flex; flex-direction: column; gap: 4px;">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{t.surf2}}; margin-bottom: 12px;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px;"><span style="font-size: 22px; font-weight: 600; letter-spacing: -.02em;">Decks</span><button type="button" class="sc-press" style="height: 40px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; border: 0; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{t.surf}}; color: {{t.text}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New deck</button></div>

      <a href="FocusHome.dc.html" style="display: flex; align-items: center; gap: 14px; height: 60px; border-top: 1px solid {{t.line}};"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 500;">{{d.name}}</span><span style="font-size: 13px; color: {{t.muted}};">{{d.total}} cards · {{d.ret}} remembered</span></span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px;">{{d.due}}</span><span style="height: 36px; padding: 0 16px; border-radius: 999px; background: {{t.surf}}; display: flex; align-items: center; font-size: 13px; font-weight: 600;">Study</span></a>

</div>
