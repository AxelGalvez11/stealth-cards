<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone · Learn mode · start</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Geist, -apple-system, system-ui, sans-serif; color: {{t.text}};">
  <dc-import name="PhoneDeck" dark="{{dark}}" dim="{{dim}}" deck-id="{{deckId}}" hint-size="390px,844px"></dc-import>
  <div style="position: absolute; inset: 0; background: {{t.dim}};"></div>
  <div role="dialog" aria-label="Learn mode" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; border-radius: 36px 36px 0 0; overflow: hidden; background: {{t.bg}}; padding: 10px 20px 34px;">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 354px; overflow: hidden; background: {{deep.base}}; -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,1) 18.1%, rgba(0,0,0,0.987) 24.7%, rgba(0,0,0,0.951) 30.8%, rgba(0,0,0,0.896) 36.5%, rgba(0,0,0,0.825) 41.9%, rgba(0,0,0,0.741) 47%, rgba(0,0,0,0.648) 51.8%, rgba(0,0,0,0.55) 56.7%, rgba(0,0,0,0.45) 61.4%, rgba(0,0,0,0.352) 66.3%, rgba(0,0,0,0.259) 71.1%, rgba(0,0,0,0.175) 76.2%, rgba(0,0,0,0.104) 81.6%, rgba(0,0,0,0.049) 87.3%, rgba(0,0,0,0.013) 93.4%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(180deg, rgba(0,0,0,1) 18.1%, rgba(0,0,0,0.987) 24.7%, rgba(0,0,0,0.951) 30.8%, rgba(0,0,0,0.896) 36.5%, rgba(0,0,0,0.825) 41.9%, rgba(0,0,0,0.741) 47%, rgba(0,0,0,0.648) 51.8%, rgba(0,0,0,0.55) 56.7%, rgba(0,0,0,0.45) 61.4%, rgba(0,0,0,0.352) 66.3%, rgba(0,0,0,0.259) 71.1%, rgba(0,0,0,0.175) 76.2%, rgba(0,0,0,0.104) 81.6%, rgba(0,0,0,0.049) 87.3%, rgba(0,0,0,0.013) 93.4%, rgba(0,0,0,0) 100%);"><svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" style="position: absolute; inset: 0; pointer-events: none;"><defs><filter id="{{deep.fid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="{{deep.disp}}" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="{{deep.blur}}"/></filter><filter id="{{deep.sid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="{{deep.sblur}}"/></filter></defs><g filter="url(#{{deep.fid}})"><ellipse cx="{{deep.b0.x}}" cy="{{deep.b0.y}}" rx="{{deep.b0.rx}}" ry="{{deep.b0.ry}}" fill="{{deep.b0.c}}" transform="rotate({{deep.b0.r}} {{deep.b0.x}} {{deep.b0.y}})"/><ellipse cx="{{deep.b1.x}}" cy="{{deep.b1.y}}" rx="{{deep.b1.rx}}" ry="{{deep.b1.ry}}" fill="{{deep.b1.c}}" transform="rotate({{deep.b1.r}} {{deep.b1.x}} {{deep.b1.y}})"/><ellipse cx="{{deep.b2.x}}" cy="{{deep.b2.y}}" rx="{{deep.b2.rx}}" ry="{{deep.b2.ry}}" fill="{{deep.b2.c}}" transform="rotate({{deep.b2.r}} {{deep.b2.x}} {{deep.b2.y}})"/><ellipse cx="{{deep.b3.x}}" cy="{{deep.b3.y}}" rx="{{deep.b3.rx}}" ry="{{deep.b3.ry}}" fill="{{deep.b3.c}}" transform="rotate({{deep.b3.r}} {{deep.b3.x}} {{deep.b3.y}})"/><ellipse cx="{{deep.b4.x}}" cy="{{deep.b4.y}}" rx="{{deep.b4.rx}}" ry="{{deep.b4.ry}}" fill="{{deep.b4.c}}" transform="rotate({{deep.b4.r}} {{deep.b4.x}} {{deep.b4.y}})"/><ellipse cx="{{deep.b5.x}}" cy="{{deep.b5.y}}" rx="{{deep.b5.rx}}" ry="{{deep.b5.ry}}" fill="{{deep.b5.c}}" transform="rotate({{deep.b5.r}} {{deep.b5.x}} {{deep.b5.y}})"/></g><g filter="url(#{{deep.sid}})"><ellipse cx="{{deep.s0.x}}" cy="{{deep.s0.y}}" rx="{{deep.s0.rx}}" ry="{{deep.s0.ry}}" fill="{{deep.s0.c}}" transform="rotate({{deep.s0.r}} {{deep.s0.x}} {{deep.s0.y}})"/><ellipse cx="{{deep.s1.x}}" cy="{{deep.s1.y}}" rx="{{deep.s1.rx}}" ry="{{deep.s1.ry}}" fill="{{deep.s1.c}}" transform="rotate({{deep.s1.r}} {{deep.s1.x}} {{deep.s1.y}})"/></g></svg><svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; mix-blend-mode: soft-light; opacity: {{grain}}; pointer-events: none;"><filter id="sc-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="3.4" intercept="-1.2"/><feFuncG type="linear" slope="3.4" intercept="-1.2"/><feFuncB type="linear" slope="3.4" intercept="-1.2"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(#sc-grain)"/></svg></div><div style="position: relative; display: flex; flex-direction: column; gap: 18px;"><div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.45);"></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #FFFFFF;"><span style="display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 600; letter-spacing: -.02em;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>Learn mode</span><a href="PhoneDeck.dc.html" aria-label="Close" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.3); color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>
    <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.9); text-shadow: {{deep.shadow}};">Learn cards until you know every one. Each card is asked a few different ways, and the ones you miss come back.</p>
    <div style="display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 13px; font-weight: 600;">Cards</span><div role="group" style="display: flex; padding: 4px; border-radius: 999px; background: {{t.surf}};"><sc-for list="{{sets}}" as="o" hint-placeholder-count="4"><button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="flex: 1 1 0; min-width: 0; height: 38px; padding: 0 6px; border: 0; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.sh}}; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;">{{o.label}}</button></sc-for></div></div>
    <div style="display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 13px; font-weight: 600;">Kinds of questions</span><div style="display: flex; flex-wrap: wrap; gap: 8px;"><sc-for list="{{kinds}}" as="k" hint-placeholder-count="5"><button type="button" onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: {{k.bg}}; color: {{k.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;"><sc-if value="{{k.on}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></sc-if>{{k.label}}</button></sc-for></div></div>
    <div style="font-size: 13px; color: {{t.muted}};">{{goalLine}}</div>
    <div style="display: flex; gap: 10px;"><a href="PhoneDeck.dc.html" style="flex-grow: 1; height: 52px; border-radius: 999px; background: {{t.surf}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600;">Cancel</a><a href="{{startHref}}" onClick="{{start}}" style="flex-grow: 2; height: 52px; border-radius: 999px; background: {{t.inv}}; color: {{t.invText}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>Start learning</a></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends LucidaLogic(DCLogic, 0) {

constructor(props) { super(props); this.state = { set: null, kinds: ['mc', 'match', 'tf', 'blank'] }; }
renderVals() { const t = this.theme(!!this.props.dark, !!this.props.dim);const db = this.props.db || this.mock(); const chrome = db.chrome();
  const s = this.state, id = this.props.deckId, seg = (k, cur) => ({ pressed: k === cur ? 'true' : 'false', bg: k === cur ? t.bg : 'transparent', fg: k === cur ? t.text : t.muted, sh: k === cur ? '0 1px 3px rgba(0,0,0,.14)' : 'none' });
  const sets = db.mock ? [{ id: 'new', label: 'New', n: 10 }, { id: 'hard', label: 'Hard', n: 36 }, { id: 'tag:Exam 1', label: 'Exam 1', n: 40 }, { id: 'all', label: 'All', n: 412 }] : db.learnSets(id);
  const set = sets.find(x => x.id === s.set) || (db.mock ? sets[2] : sets.find(x => x.n > 0) || sets[sets.length - 1]), n = set.n, mins = Math.max(1, Math.round(n * .6));
  return { t, dark: !!this.props.dark, dim: !!this.props.dim, deckId: id || '', sky: (this.props.dark && this.props.dim ? { top: '#1B2A48', mid: '#1F2B45', low: '#212637', glow: 'rgba(120,150,255,.16)', cloud: 'rgba(150,170,230,.12)' }
    : this.props.dark ? { top: '#081733', mid: '#0D2148', low: '#0A1530', glow: 'rgba(120,150,255,.16)', cloud: 'rgba(150,170,230,.10)' }
    : { top: '#86BDF3', mid: '#C9E2FB', low: '#EDF5FE', glow: 'rgba(255,255,255,.75)', cloud: 'rgba(255,255,255,.94)' }), grain: String(this.props.grain ?? 0.7), m1: this.mesh('Iris'), m2: this.mesh('Mint'), deep: {"base":"linear-gradient(102deg, #14165A 0%, #20238A 17%, #1B2378 32%, #151D66 52%, #172372 70%, #123F86 86%, #0B6C9C 100%)","ink":"#FFFFFF","fid":"sc-flow-midnight","sid":"sc-streak-midnight","blur":"6","sblur":"2.2","disp":"10","glass":"rgba(255,255,255,.12)","glassLine":"rgba(255,255,255,.62)","shadow":"0 1px 14px rgba(0,0,0,.16)","b0":{"c":"#3440C4","x":14,"y":70,"rx":10,"ry":70,"r":12},"b1":{"c":"#1A2270","x":55,"y":40,"rx":12,"ry":80,"r":12},"b2":{"c":"#0E8CC6","x":102,"y":102,"rx":20,"ry":42,"r":18},"b3":{"c":"#262C8E","x":88,"y":0,"rx":22,"ry":26,"r":0},"b4":{"c":"#4450DA","x":6,"y":100,"rx":16,"ry":22,"r":12},"b5":{"c":"#1C2A80","x":72,"y":60,"rx":10,"ry":70,"r":12},"s0":{"c":"#5A64E6","x":1,"y":40,"rx":3.2,"ry":70,"r":12},"s1":{"c":"#3A47C0","x":44,"y":50,"rx":2.6,"ry":80,"r":12}}, sets: sets.map(x => ({ label: x.label + ' · ' + x.n, ...seg(x.id, set.id), pick: () => this.setState({ set: x.id }) })),
    kinds: [["mc","Multiple choice"],["match","Matching"],["tf","True or false"],["blank","Fill in the blank"],["type","Type the answer"]].map(([k, label]) => { const on = s.kinds.includes(k); return { label, on, pressed: on ? 'true' : 'false', bg: on ? t.inv : t.surf, fg: on ? t.invText : t.text, pick: () => this.setState({ kinds: on && s.kinds.length > 1 ? s.kinds.filter(x => x !== k) : on ? s.kinds : [...s.kinds, k] }) }; }),
    goalLine: n ? 'Learn all ' + n + ' card' + (n === 1 ? '' : 's') + ', about ' + (mins >= 90 ? Math.round(mins / 60) + ' hours over a few sessions' : mins + ' minute' + (mins === 1 ? '' : 's')) + '. You can stop anytime and pick up where you left off.' : 'This deck has no cards to learn yet. Picture and text cards work; sound cards come later.',
    startHref: 'PhoneQuiz.dc.html',
    start: e => { if (db.mock) return; if (e && e.preventDefault) e.preventDefault(); if (n) db.act.startLearn(id, set.id, s.kinds); } }; }
}
</script>
</body>
</html>
