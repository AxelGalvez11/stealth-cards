<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top tabs · Today</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; font-family: Geist, -apple-system, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}; overflow: hidden;">
<header style="height: 76px; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center;">
  <div style="width: 240px;"><div style="display: flex; align-items: center; gap: 9px;"><svg width="14" height="13" viewBox="0 0 33 30.5" fill="currentColor" aria-hidden="true" style="flex-shrink: 0; display: block;"><circle cx="7" cy="7" r="7"/><circle cx="26" cy="7" r="7"/><circle cx="16.5" cy="23.45" r="7"/></svg><div style="font-size: 17px; font-weight: 600; letter-spacing: -.02em;">Lucida</div></div></div>
  <nav style="flex-grow: 1; display: flex; justify-content: center;"><div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: {{t.surf}};">
    <a href="TopToday.dc.html" style="height: 38px; padding: 0 20px; display: flex; align-items: center; border-radius: 999px; font-size: 14px; font-weight: 500; background: {{t.bg}}; color: {{t.text}}; box-shadow: 0 1px 3px rgba(0,0,0,.12);">Today</a><a href="TopDeck.dc.html" style="height: 38px; padding: 0 20px; display: flex; align-items: center; border-radius: 999px; font-size: 14px; font-weight: 500; color: {{t.muted}};">Decks</a><a href="TopToday.dc.html" style="height: 38px; padding: 0 20px; display: flex; align-items: center; border-radius: 999px; font-size: 14px; font-weight: 500; color: {{t.muted}};">Stats</a><a href="TopToday.dc.html" style="height: 38px; padding: 0 20px; display: flex; align-items: center; border-radius: 999px; font-size: 14px; font-weight: 500; color: {{t.muted}};">Connect</a>
  </div></nav>
  <div style="width: 240px; display: flex; justify-content: flex-end; gap: 8px;"><button type="button" aria-label="Search" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: {{t.surf}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><span style="width: 40px; height: 40px; border-radius: 20px; background: {{t.surf2}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;">A</span></div>
</header>
<main style="flex-grow: 1; display: flex; justify-content: center; padding-top: 40px;">
  <div style="width: 680px; display: flex; flex-direction: column; gap: 36px;">
    <div style="position: relative; overflow: hidden; color: {{hero.ink}}; background: {{hero.base}}; border-radius: 36px; flex-shrink: 0;"><svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" style="position: absolute; inset: 0; pointer-events: none;"><defs><filter id="{{hero.fid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="{{hero.disp}}" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="{{hero.blur}}"/></filter><filter id="{{hero.sid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="{{hero.sblur}}"/></filter></defs><g filter="url(#{{hero.fid}})"><ellipse cx="{{hero.b0.x}}" cy="{{hero.b0.y}}" rx="{{hero.b0.rx}}" ry="{{hero.b0.ry}}" fill="{{hero.b0.c}}" transform="rotate({{hero.b0.r}} {{hero.b0.x}} {{hero.b0.y}})"/><ellipse cx="{{hero.b1.x}}" cy="{{hero.b1.y}}" rx="{{hero.b1.rx}}" ry="{{hero.b1.ry}}" fill="{{hero.b1.c}}" transform="rotate({{hero.b1.r}} {{hero.b1.x}} {{hero.b1.y}})"/><ellipse cx="{{hero.b2.x}}" cy="{{hero.b2.y}}" rx="{{hero.b2.rx}}" ry="{{hero.b2.ry}}" fill="{{hero.b2.c}}" transform="rotate({{hero.b2.r}} {{hero.b2.x}} {{hero.b2.y}})"/><ellipse cx="{{hero.b3.x}}" cy="{{hero.b3.y}}" rx="{{hero.b3.rx}}" ry="{{hero.b3.ry}}" fill="{{hero.b3.c}}" transform="rotate({{hero.b3.r}} {{hero.b3.x}} {{hero.b3.y}})"/><ellipse cx="{{hero.b4.x}}" cy="{{hero.b4.y}}" rx="{{hero.b4.rx}}" ry="{{hero.b4.ry}}" fill="{{hero.b4.c}}" transform="rotate({{hero.b4.r}} {{hero.b4.x}} {{hero.b4.y}})"/><ellipse cx="{{hero.b5.x}}" cy="{{hero.b5.y}}" rx="{{hero.b5.rx}}" ry="{{hero.b5.ry}}" fill="{{hero.b5.c}}" transform="rotate({{hero.b5.r}} {{hero.b5.x}} {{hero.b5.y}})"/></g><g filter="url(#{{hero.sid}})"><ellipse cx="{{hero.s0.x}}" cy="{{hero.s0.y}}" rx="{{hero.s0.rx}}" ry="{{hero.s0.ry}}" fill="{{hero.s0.c}}" transform="rotate({{hero.s0.r}} {{hero.s0.x}} {{hero.s0.y}})"/><ellipse cx="{{hero.s1.x}}" cy="{{hero.s1.y}}" rx="{{hero.s1.rx}}" ry="{{hero.s1.ry}}" fill="{{hero.s1.c}}" transform="rotate({{hero.s1.r}} {{hero.s1.x}} {{hero.s1.y}})"/></g></svg><svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; mix-blend-mode: soft-light; opacity: {{grain}}; pointer-events: none;"><filter id="sc-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="3.4" intercept="-1.2"/><feFuncG type="linear" slope="3.4" intercept="-1.2"/><feFuncB type="linear" slope="3.4" intercept="-1.2"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(#sc-grain)"/></svg><div style="position: relative; text-shadow: {{hero.shadow}}; box-sizing: border-box; padding: 36px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;">
      <div style="font-size: 14px; opacity: .8;">Tuesday · 12-day streak</div>
      <h1 style="margin: 0; font-size: 88px; font-weight: 500; letter-spacing: -.05em; line-height: .95;">64 due</h1>
      <a href="WebReview.dc.html" style="height: 56px; padding: 0 40px; border-radius: 999px; background: #FFFFFF; color: #000000; display: inline-flex; align-items: center; font-size: 16px; font-weight: 600;">Start review · 11 min</a></div></div>
    <div style="background: {{t.surf}}; border-radius: 28px; padding: 8px;">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 16px;">
          <span style="font-size: 12px; font-weight: 600; width: 64px;">{{i.src}}</span>
          <span style="flex-grow: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{i.front}}</span>
          <button type="button" onClick="{{i.toss}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: {{t.bg}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Toss</button>
          <button type="button" onClick="{{i.keep}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: {{t.inv}}; color: {{t.invText}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Keep</button>
        </div>
      </sc-for>
      <sc-if value="{{noItems}}" hint-placeholder-val="{{ false }}"><div style="padding: 16px; font-size: 14px; color: {{t.muted}};">All AI cards checked.</div></sc-if>
    </div>
    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{decks}}" as="d" hint-placeholder-count="4">
        <a href="TopDeck.dc.html" style="display: flex; align-items: center; gap: 12px; height: 60px; border-bottom: 1px solid {{t.line}};"><span style="flex-grow: 1; font-size: 16px; font-weight: 500;">{{d.name}}</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px;">{{d.due}}</span><span style="color: {{t.muted}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
      </sc-for>
    </div>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"gradient":{"editor":"enum","default":"Iris","options":["Iris","Apricot","Lilac","Mint","Aqua","Rose","Lemon","Dusk","Grove","Forest","Ember","Meadow","Ocean","Sun"]},"grain":{"editor":"range","default":0.7,"min":0,"max":1,"step":0.05},"$preview":{"width":1440,"height":900}}'>
class Component extends LucidaLogic(DCLogic, 0) {

constructor(props) { super(props); this.state = { handled: {} }; }
renderVals() { const t = this.theme(!!this.props.dark, !!this.props.dim);
  const done = this.state.handled || {};
  const items = [
  { id: 1, src: 'Claude', kind: 'Fill in the blank', front: 'The ____ is the powerhouse of the cell.', deck: 'Cell Biology' },
  { id: 2, src: 'ChatGPT', kind: 'Audio', front: 'What word do you hear? (でんしゃ)', deck: 'Japanese · JLPT N4' },
  { id: 3, src: 'Claude', kind: 'Image', front: 'Name structure 1 on the diagram.', deck: 'Cell Biology' }
].filter(i => !done[i.id]).map(i => ({ ...i,
    keep: () => this.setState({ handled: { ...done, [i.id]: 'kept' } }),
    toss: () => this.setState({ handled: { ...done, [i.id]: 'tossed' } }) }));
  const kept = Object.values(done).filter(v => v === 'kept').length;
  const tossed = Object.values(done).filter(v => v === 'tossed').length;
  return { hero: this.mesh(this.props.gradient ?? 'Iris'), grain: String(this.props.grain ?? 0.7), t, items, noItems: items.length === 0, decks: [
  { name: 'Cell Biology', total: '412', due: 28, overdue: 12, soon: 0, fresh: 10, ret: '91%' },
  { name: 'Japanese · JLPT N4', total: '1,280', due: 19, overdue: 5, soon: 0, fresh: 20, ret: '87%' },
  { name: 'Organic Chemistry', total: '236', due: 11, overdue: 0, soon: 0, fresh: 5, ret: '84%' },
  { name: 'US History', total: '158', due: 6, overdue: 0, soon: 0, fresh: 0, ret: '93%' },
  { name: 'System Design', total: '74', due: 0, overdue: 0, soon: 1, fresh: 8, ret: '89%' },
  { name: 'Spanish Verbs', total: '310', due: 0, overdue: 0, soon: 3, fresh: 0, ret: '95%' }
].slice(0, 3) }; }
}
</script>
</body>
</html>
