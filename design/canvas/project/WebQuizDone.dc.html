<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");
@media (prefers-reduced-motion:reduce){.sc-occ{transition:none!important}}.sc-lg{width:100%;display:grid;grid-template-columns:minmax(0,720px);justify-content:center;align-items:start;gap:24px}.sc-lx-side{display:none}@container (min-width:944px){.sc-lg.sc-xo{grid-template-columns:minmax(560px,720px) 360px}.sc-lg.sc-xo>.sc-lx-side{display:flex}.sc-lg.sc-xo .sc-lx-in{display:none!important}}@keyframes scQuizIn{from{opacity:0;transform:translateY(6px)}}@keyframes scQA{from{opacity:0;transform:translateY(12px)}}@keyframes scQB{from{opacity:0;transform:translateY(12px)}}@keyframes scShake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes scPop{40%{transform:scale(1.025)}}@keyframes scPlusA{0%{opacity:0;transform:translateY(6px)}25%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}@keyframes scPlusB{0%{opacity:0;transform:translateY(6px)}25%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}.sc-tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:scTick .32s .06s ease forwards}@keyframes scTick{to{stroke-dashoffset:0}}@property --sc-n{syntax:'<integer>';initial-value:0;inherits:false}.sc-count{--sc-n:var(--to);counter-reset:n var(--sc-n);animation:scCount 1.1s .25s cubic-bezier(.2,.8,.2,1) backwards}.sc-count::after{content:counter(n)}@keyframes scCount{from{--sc-n:0}}@keyframes scLearnIn{from{transform:none}to{transform:translateY(-5px)}}@keyframes scLearnHover{from{transform:translateY(-5px)}to{transform:translateY(-9px)}}@media (prefers-reduced-motion:reduce){.sc-quiz-in,.sc-shake,.sc-q,.sc-count,.sc-plus,.sc-opt{animation:none!important}.sc-tick path{animation:none;stroke-dashoffset:0}}
</style>
</helmet>
<div style="position: relative; isolation: isolate; width: 1440px; height: 900px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: Geist, -apple-system, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}};">
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: {{t.bg}};">
  <sc-if value="{{bg.isDeck}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; inset: -4%; background: {{bg.mesh.base}}; filter: {{bg.filter}};"><svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" style="position: absolute; inset: 0; pointer-events: none;"><defs><filter id="{{bg.mesh.fid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="{{bg.mesh.disp}}" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="{{bg.mesh.blur}}"/></filter><filter id="{{bg.mesh.sid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="{{bg.mesh.sblur}}"/></filter></defs><g filter="url(#{{bg.mesh.fid}})"><ellipse cx="{{bg.mesh.b0.x}}" cy="{{bg.mesh.b0.y}}" rx="{{bg.mesh.b0.rx}}" ry="{{bg.mesh.b0.ry}}" fill="{{bg.mesh.b0.c}}" transform="rotate({{bg.mesh.b0.r}} {{bg.mesh.b0.x}} {{bg.mesh.b0.y}})"/><ellipse cx="{{bg.mesh.b1.x}}" cy="{{bg.mesh.b1.y}}" rx="{{bg.mesh.b1.rx}}" ry="{{bg.mesh.b1.ry}}" fill="{{bg.mesh.b1.c}}" transform="rotate({{bg.mesh.b1.r}} {{bg.mesh.b1.x}} {{bg.mesh.b1.y}})"/><ellipse cx="{{bg.mesh.b2.x}}" cy="{{bg.mesh.b2.y}}" rx="{{bg.mesh.b2.rx}}" ry="{{bg.mesh.b2.ry}}" fill="{{bg.mesh.b2.c}}" transform="rotate({{bg.mesh.b2.r}} {{bg.mesh.b2.x}} {{bg.mesh.b2.y}})"/><ellipse cx="{{bg.mesh.b3.x}}" cy="{{bg.mesh.b3.y}}" rx="{{bg.mesh.b3.rx}}" ry="{{bg.mesh.b3.ry}}" fill="{{bg.mesh.b3.c}}" transform="rotate({{bg.mesh.b3.r}} {{bg.mesh.b3.x}} {{bg.mesh.b3.y}})"/><ellipse cx="{{bg.mesh.b4.x}}" cy="{{bg.mesh.b4.y}}" rx="{{bg.mesh.b4.rx}}" ry="{{bg.mesh.b4.ry}}" fill="{{bg.mesh.b4.c}}" transform="rotate({{bg.mesh.b4.r}} {{bg.mesh.b4.x}} {{bg.mesh.b4.y}})"/><ellipse cx="{{bg.mesh.b5.x}}" cy="{{bg.mesh.b5.y}}" rx="{{bg.mesh.b5.rx}}" ry="{{bg.mesh.b5.ry}}" fill="{{bg.mesh.b5.c}}" transform="rotate({{bg.mesh.b5.r}} {{bg.mesh.b5.x}} {{bg.mesh.b5.y}})"/></g><g filter="url(#{{bg.mesh.sid}})"><ellipse cx="{{bg.mesh.s0.x}}" cy="{{bg.mesh.s0.y}}" rx="{{bg.mesh.s0.rx}}" ry="{{bg.mesh.s0.ry}}" fill="{{bg.mesh.s0.c}}" transform="rotate({{bg.mesh.s0.r}} {{bg.mesh.s0.x}} {{bg.mesh.s0.y}})"/><ellipse cx="{{bg.mesh.s1.x}}" cy="{{bg.mesh.s1.y}}" rx="{{bg.mesh.s1.rx}}" ry="{{bg.mesh.s1.ry}}" fill="{{bg.mesh.s1.c}}" transform="rotate({{bg.mesh.s1.r}} {{bg.mesh.s1.x}} {{bg.mesh.s1.y}})"/></g></svg></div></sc-if>
  <sc-if value="{{bg.isPhoto}}" hint-placeholder-val="{{ false }}"><img src="{{bg.photo}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;"></sc-if>
  <sc-if value="{{bg.isSky}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; right: 0; top: 0; height: 700px; background: linear-gradient(180deg, {{bg.skyTop}} 0%, {{bg.skyMid}} 30%, {{bg.skyLow}} 55%, {{t.bg}} 100%);"></div></sc-if>
  <sc-if value="{{bg.isSunset}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; background: {{bg.sunset}};"></div></sc-if>
  <sc-if value="{{bg.skin}}" hint-placeholder-val="{{ false }}"><div ref="{{bg.art}}" data-sc-own style="position: absolute; inset: 0; overflow: hidden;"></div></sc-if>
  <div style="position: absolute; inset: 0; background: {{bg.veil}};"></div>
  <svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; mix-blend-mode: overlay; opacity: {{bg.grain}}; pointer-events: none;"><filter id="sc-study-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="3.4" intercept="-1.2"/><feFuncG type="linear" slope="3.4" intercept="-1.2"/><feFuncB type="linear" slope="3.4" intercept="-1.2"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(#sc-study-grain)"/></svg>
</div>
  <main style="width: 560px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center;">
    <div style="position: relative; width: 190px; height: 190px;"><svg width="190" height="190" viewBox="0 0 190 190" aria-hidden="true"><circle cx="95" cy="95" r="87" fill="none" stroke="{{t.surf2}}" stroke-width="16"/><circle class="sc-draw" pathLength="1" transform="rotate(-90 95 95)" cx="95" cy="95" r="87" fill="none" stroke="{{ring}}" stroke-width="16" stroke-linecap="round"/></svg><div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;"><span aria-label="{{total}} of {{total}}" style="font-size: 41px; font-weight: 600; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums;"><span class="sc-count" style="--to: {{total}};"></span>/{{total}}</span><span style="margin-top: 4px; font-size: 13px; color: {{t.muted}};">learned</span></div></div>
    <div style="display: flex; flex-direction: column; gap: 8px;"><h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -.03em;">{{title}}</h1><div style="font-size: 16px; color: {{t.muted}};">{{summary}}</div></div>
    <div style="width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 18px; background: {{t.surf}}; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 14px; line-height: 1.45;"><span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>They’re in your reviews now. Lucida brings each card back right before you’d forget it.</div>
    <sc-if value="{{hasTries}}" hint-placeholder-val="{{ true }}"><div style="width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left;"><span style="font-size: 15px; font-weight: 600;">Took the most tries</span><sc-for list="{{tries}}" as="m" hint-placeholder-count="2"><div style="box-sizing: border-box; padding: 14px 16px; border-radius: 18px; background: {{t.surf}}; display: flex; align-items: center; justify-content: space-between; gap: 12px;"><span style="min-width: 0; font-size: 15px; line-height: 1.35;">{{m.front}} <span style="color: {{t.muted}};">→</span> <span style="font-weight: 600;">{{m.back}}</span></span><span style="flex-shrink: 0; font-size: 13px; color: {{t.muted}};">{{m.n}}</span></div></sc-for></div></sc-if>
    <div style="width: 100%; display: flex; gap: 10px;"><a href="WebQuizStart.dc.html" style="flex-grow: 1; height: 52px; border-radius: 999px; background: {{t.surf}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600;">Learn more cards</a><a href="WebDeck.dc.html" style="flex-grow: 1; height: 52px; border-radius: 999px; background: {{t.inv}}; color: {{t.invText}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600;">Done</a></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends LucidaLogic(DCLogic, 0) {
renderVals() { const db = this.props.db || this.mock(); const chrome = db.chrome();
  const L = db.mock ? { total: 40, setName: 'Exam 1', minutes: 26, firstPct: 88, tries: [{ front: 'Lysosome', back: 'Breaks down waste', n: '4 tries' }, { front: 'What is the role of the ribosome?', back: 'Translates mRNA into protein', n: '3 tries' }] }
    : db.learn() || { total: 0, setName: '', minutes: 0, firstPct: 0, tries: [] };
  const studyBg = (dk, dark, dim, S, phone) => {
    const b = (dk && dk.bg) || {}, img = b.image || (dk && dk.image) || '';
    const kind = ['deck', 'plain', 'sky', 'sunset', 'photo'].includes(b.kind) && !(b.kind === 'photo' && !img) ? b.kind : 'deck';
    const mesh = this.gen(((dk && dk.seed) || 'Lucida') + (dk && dk.round ? ' #' + dk.round : ''), (dk && dk.style) || 'mix');
    const skin = !!S && kind === 'deck';
    // On the canvas a photo is a placeholder, so it shows the deck's colors at full strength instead.
    const photo = kind === 'photo' && img !== 'mock' ? img : '', sample = kind === 'photo' && !photo, faint = kind === 'deck' && !skin, gray = dark && dim;
    // In light mode the deck's colors are one pale hue (the owner: "make the background for flashcards and learn be
    // monochrome and lighter/fainter on light mode"): every fold of its gradient in the deck's main color (the middle of
    // the gradient), light and soft, a pastel wash under the words. Dark and gray keep theirs.
    const mono = faint && !dark, hue = parseInt(mesh.base.split('hsl(')[2]) || 0;
    const pale = c => c.replace(/hsl\((\d+) (\d+)% (\d+)%\)/g, (_, h, s, l) => 'hsl(' + hue + ' 50% ' + Math.round(84 + l * .12) + '%)');
    return { isDeck: faint || sample, isPhoto: !!photo, isSky: kind === 'sky', isSunset: kind === 'sunset', photo, skin, art: skin ? S.bg(!!phone) : null, dark: skin ? S.dark : dark,
      mesh: mono ? Object.fromEntries(Object.entries(mesh).map(([k, v]) => [k, typeof v === 'string' ? pale(v) : v && v.c ? { ...v, c: pale(v.c) } : v])) : mesh,
      filter: sample || !dark ? 'none' : gray ? 'saturate(.16) brightness(.34)' : 'saturate(.16) brightness(.42)',
      veil: faint ? (gray ? 'rgba(30,30,32,.45)' : dark ? 'rgba(0,0,0,.3)' : 'rgba(255,255,255,.35)') : photo || sample ? (gray ? 'rgba(30,30,32,.55)' : dark ? 'rgba(0,0,0,.5)' : 'rgba(255,255,255,.38)') : 'rgba(0,0,0,0)',
      skyTop: gray ? '#1B2A48' : dark ? '#081733' : '#86BDF3', skyMid: gray ? '#1F2B45' : dark ? '#0D2148' : '#C9E2FB', skyLow: gray ? '#212637' : dark ? '#0A1530' : '#EDF5FE',
      sunset: gray ? "radial-gradient(90% 60% at 88% 100%, rgba(238,142,98,.18), rgba(238,142,98,0) 70%), linear-gradient(180deg, #1F2638 0%, #272C40 35%, #332C3F 65%, #3E2E37 100%)" : dark ? "radial-gradient(90% 60% at 88% 100%, rgba(238,142,98,.16), rgba(238,142,98,0) 70%), linear-gradient(180deg, #0C1426 0%, #151B31 35%, #231C2E 65%, #2E1D25 100%)" : "radial-gradient(90% 60% at 88% 100%, rgba(238,142,98,.22), rgba(238,142,98,0) 70%), linear-gradient(180deg, #C3D3E3 0%, #D3DBE6 30%, #E6DDE4 52%, #F2DCD8 72%, #F5CFC2 100%)", grain: faint || sample || kind === 'sunset' ? '.55' : '0' };
  };
  // The deck's background, or your theme's, whose look sets the page's colors.
  const S = this.skin(db), bg = studyBg(db.deck(db.mock ? 'cell' : (db.learn() || {}).deckId || this.props.deckId), !!this.props.dark, !!this.props.dim, S, false), t = this.theme(bg.dark, !!this.props.dim);
  return { t, sky: (this.props.dark && this.props.dim ? { top: '#1B2A48', mid: '#1F2B45', low: '#212637', glow: 'rgba(120,150,255,.16)', cloud: 'rgba(150,170,230,.12)' }
    : this.props.dark ? { top: '#081733', mid: '#0D2148', low: '#0A1530', glow: 'rgba(120,150,255,.16)', cloud: 'rgba(150,170,230,.10)' }
    : { top: '#86BDF3', mid: '#C9E2FB', low: '#EDF5FE', glow: 'rgba(255,255,255,.75)', cloud: 'rgba(255,255,255,.94)' }), bg, ring: bg.dark ? '#8C9AFC' : '#4353E0', total: String(L.total), title: L.total === 1 ? 'You learned it' : 'You learned all ' + L.total + ' cards',
    summary: L.setName + ' · ' + L.minutes + ' minute' + (L.minutes === 1 ? '' : 's') + ' · ' + L.firstPct + '% right the first time', summaryShort: L.setName + ' · ' + L.minutes + ' min · ' + L.firstPct + '% first time',
    hasTries: L.tries.length > 0, tries: L.tries }; }
}
</script>
</body>
