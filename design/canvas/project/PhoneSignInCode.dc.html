<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone · Sign in · code from email</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Geist, -apple-system, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}; overflow: hidden;">
<div style="flex: 1 0 auto; box-sizing: border-box; padding: 64px 20px 34px; display: flex; flex-direction: column; gap: 28px;">
  <a href="PhoneSignIn.dc.html" aria-label="Use another email" style="width: 44px; height: 44px; border-radius: 22px; background: {{t.surf}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div style="display: flex; flex-direction: column; gap: 8px; text-align: center;"><h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -.03em;">Check your email</h1><div style="font-size: 15px; line-height: 1.45; color: {{t.muted}};">Enter the 6-digit code we sent to <span style="color: {{t.text}}; font-weight: 500;">{{sentTo}}</span></div></div>
  <label style="position: relative; display: flex; justify-content: space-between; gap: 6px; cursor: text;"><sc-for list="{{boxes}}" as="b" hint-placeholder-count="6"><span style="flex: 0 1 50px; min-width: 0; height: 58px; border-radius: 14px; background: {{t.surf}}; box-shadow: {{b.ring}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600;">{{b.digit}}</span></sc-for><input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="{{code}}" onChange="{{setCode}}" aria-label="6-digit code" style="position: absolute; inset: 0; width: 100%; opacity: 0; border: 0; padding: 0; font-size: 16px;"></label><sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}"><div role="alert" style="padding: 2px 4px 0; font-size: 14px; line-height: 1.4; color: {{t.again}}; text-align: center;">{{error}}</div></sc-if>
  <div style="flex-grow: 1;"></div>
  <div style="display: flex; flex-direction: column; gap: 14px;"><a href="PhoneLibrary.dc.html" onClick="{{verify}}" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: {{t.inv}}; color: {{t.invText}}; font-size: 16px; font-weight: 600;">{{verifyLabel}}</a><button type="button" onClick="{{resend}}" style="align-self: center; border: 0; padding: 0; background: transparent; color: {{t.muted}}; font: inherit; font-size: 15px; cursor: pointer;">{{resendLabel}}</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends LucidaLogic(DCLogic, 0) {
art(p, variant) {
  const name = p.fid + (variant ? '-' + variant : ''), on = !!(this.props.site || this.props.db) && ["sc-flow-midnight","sc-flow-midnight-wide","sc-gen-1bgiry6","sc-gen-1eyvfay","sc-gen-1h674rq","sc-gen-1iccxh","sc-gen-1madw05","sc-gen-1mheeld","sc-gen-1mukigx","sc-gen-1neye4o","sc-gen-1s1ssqz","sc-gen-1tj9ifj","sc-gen-1ul2ng5","sc-gen-1yac7zp","sc-gen-2xvhhe","sc-gen-5gnrcu","sc-gen-8f1umk","sc-gen-90zkel","sc-gen-favxds","sc-gen-o6z85t","sc-gen-px21tz","sc-gen-qmdzqs","sc-gen-v4yoeu","sc-gen-vwxtrt","sc-gen-ym0akm","sc-gen-yzu3mr"].includes(name);
  return { ...p, art: on ? 'url(/art/' + name + '.webp)' : '', live: !on };
}
constructor(props) { super(props); const a = props.db && props.db.auth; this.state = { email: a ? a.email() : '', code: a ? '' : '482', resent: false, busy: false, error: a ? a.error() : '', password: '', pwOn: undefined }; }
renderVals() { const t = this.theme(!!this.props.dark, !!this.props.dim);
  const s = this.state, code = String(s.code || ''), a = this.props.db && this.props.db.auth;
  // A password instead of a code: in the app it is its own address (/sign-in/password); on the canvas the link flips the board.
  const pw = a ? !!this.props.passwordMode : (s.pwOn ?? !!this.props.passwordMode);
  // In the app (props.db) these sign in for real: an email code, or Google and Apple through the server.
  const stop = e => { if (e && e.preventDefault) e.preventDefault(); };
  const failed = e => this.setState({ busy: false, error: e.message });
  const send = e => {
    if (!a) return; stop(e);
    const email = String(s.email || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return this.setState({ error: 'Type your email address.' });
    if (s.busy) return;
    if (pw) {
      if (!s.password) return this.setState({ error: 'Type your password.' });
      this.setState({ busy: true, error: '' });
      return a.password(email, s.password).then(() => a.done(), failed);
    }
    this.setState({ busy: true, error: '' });
    a.sendCode(email).then(() => { this.setState({ busy: false }); a.go('/sign-in/code'); }, failed);
  };
  const check = digits => {
    if (!a || digits.length < 6 || s.busy) return;
    this.setState({ busy: true, error: '' });
    // A wrong code empties the boxes (and the field under them, which keeps typed text while it has focus).
    a.verify(digits).then(() => a.done(), e => { const box = document.querySelector('input[autocomplete="one-time-code"]'); if (box) box.value = ''; this.setState({ busy: false, code: '', error: e.message }); });
  };
  const leave = to => e => { if (!a) return; stop(e); location.assign(to); };
  return { grain: String(this.props.grain ?? 0.7), t, 
    email: s.email, setEmail: e => this.setState({ email: e && e.target ? e.target.value : '', error: '' }), emailKey: e => { if (e && e.key === 'Enter') send(e); },
    sentTo: (s.email || '').trim() || 'you@school.edu', sendCode: send, sendLabel: pw ? (s.busy ? 'Signing in…' : 'Sign in') : s.busy ? 'Sending…' : 'Continue',
    passwordMode: pw, password: s.password || '', emailAuto: pw ? 'username' : 'email', setPassword: e => this.setState({ password: e && e.target ? e.target.value : '', error: '' }), passwordKey: e => { if (e && e.key === 'Enter') send(e); },
    togglePassword: () => { if (!a) return this.setState({ pwOn: !pw, error: '' }); if (a.remember) a.remember(String(s.email || '').trim()); a.go(pw ? '/sign-in' : '/sign-in/password'); }, passwordToggle: pw ? 'Use an email code instead' : 'Use a password',
    google: leave('/auth/google'), apple: leave('/auth/apple'),
    code, setCode: e => { const c = String(e && e.target ? e.target.value : '').replace(/\D/g, '').slice(0, 6); this.setState({ code: c, error: '' }); check(c); },
    verify: e => { if (!a) return; stop(e); if (code.length < 6) return this.setState({ error: 'Type the 6-digit code from the email.' }); check(code); },
    verifyLabel: s.busy ? 'Checking…' : 'Continue', error: s.error, hasError: !!s.error,
    boxes: Array.from({ length: 6 }, (_, i) => ({ digit: code[i] || '', ring: i === Math.min(code.length, 5) ? 'inset 0 0 0 2px ' + t.text : 'none' })),
    resend: () => { if (!a) return this.setState({ resent: true }); a.sendCode(a.email()).then(() => this.setState({ resent: true, error: '' }), failed); },
    resendLabel: s.resent ? 'New code sent' : 'Send a new code',
    termsHref: a ? '/terms' : 'Terms.dc.html', privacyHref: a ? '/privacy' : 'Privacy.dc.html' }; }
}
</script>
</body>
</html>
