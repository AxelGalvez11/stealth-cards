<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live · host · set up</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: Geist, -apple-system, system-ui, sans-serif; color: {{t.text}};">
  <sc-if value="{{deckPage}}" hint-placeholder-val="{{ true }}"><dc-import name="WebDeck" dark="{{dark}}" dim="{{dim}}" deck-id="{{deckId}}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{libraryPage}}" hint-placeholder-val="{{ false }}"><dc-import name="WebDecks" dark="{{dark}}" dim="{{dim}}" hint-size="1440px,900px"></dc-import></sc-if>
  <div style="position: absolute; inset: 0; z-index: 40; background: {{t.dim}};"></div>
  <div role="dialog" aria-label="Play live" style="position: absolute; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 560px; box-sizing: border-box; padding: 28px; border-radius: 36px; overflow: hidden; background: {{t.bg}}; box-shadow: 0 24px 64px rgba(0,0,0,.24);">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 330px; overflow: hidden; background: {{deep.base}}; -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,1) 12.1%, rgba(0,0,0,0.987) 19.2%, rgba(0,0,0,0.951) 25.7%, rgba(0,0,0,0.896) 31.9%, rgba(0,0,0,0.825) 37.6%, rgba(0,0,0,0.741) 43.1%, rgba(0,0,0,0.648) 48.3%, rgba(0,0,0,0.55) 53.5%, rgba(0,0,0,0.45) 58.6%, rgba(0,0,0,0.352) 63.8%, rgba(0,0,0,0.259) 69%, rgba(0,0,0,0.175) 74.5%, rgba(0,0,0,0.104) 80.2%, rgba(0,0,0,0.049) 86.4%, rgba(0,0,0,0.013) 92.9%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(180deg, rgba(0,0,0,1) 12.1%, rgba(0,0,0,0.987) 19.2%, rgba(0,0,0,0.951) 25.7%, rgba(0,0,0,0.896) 31.9%, rgba(0,0,0,0.825) 37.6%, rgba(0,0,0,0.741) 43.1%, rgba(0,0,0,0.648) 48.3%, rgba(0,0,0,0.55) 53.5%, rgba(0,0,0,0.45) 58.6%, rgba(0,0,0,0.352) 63.8%, rgba(0,0,0,0.259) 69%, rgba(0,0,0,0.175) 74.5%, rgba(0,0,0,0.104) 80.2%, rgba(0,0,0,0.049) 86.4%, rgba(0,0,0,0.013) 92.9%, rgba(0,0,0,0) 100%);"><svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" style="position: absolute; inset: 0; pointer-events: none;"><defs><filter id="{{deep.fid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="{{deep.disp}}" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="{{deep.blur}}"/></filter><filter id="{{deep.sid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="{{deep.sblur}}"/></filter></defs><g filter="url(#{{deep.fid}})"><ellipse cx="{{deep.b0.x}}" cy="{{deep.b0.y}}" rx="{{deep.b0.rx}}" ry="{{deep.b0.ry}}" fill="{{deep.b0.c}}" transform="rotate({{deep.b0.r}} {{deep.b0.x}} {{deep.b0.y}})"/><ellipse cx="{{deep.b1.x}}" cy="{{deep.b1.y}}" rx="{{deep.b1.rx}}" ry="{{deep.b1.ry}}" fill="{{deep.b1.c}}" transform="rotate({{deep.b1.r}} {{deep.b1.x}} {{deep.b1.y}})"/><ellipse cx="{{deep.b2.x}}" cy="{{deep.b2.y}}" rx="{{deep.b2.rx}}" ry="{{deep.b2.ry}}" fill="{{deep.b2.c}}" transform="rotate({{deep.b2.r}} {{deep.b2.x}} {{deep.b2.y}})"/><ellipse cx="{{deep.b3.x}}" cy="{{deep.b3.y}}" rx="{{deep.b3.rx}}" ry="{{deep.b3.ry}}" fill="{{deep.b3.c}}" transform="rotate({{deep.b3.r}} {{deep.b3.x}} {{deep.b3.y}})"/><ellipse cx="{{deep.b4.x}}" cy="{{deep.b4.y}}" rx="{{deep.b4.rx}}" ry="{{deep.b4.ry}}" fill="{{deep.b4.c}}" transform="rotate({{deep.b4.r}} {{deep.b4.x}} {{deep.b4.y}})"/><ellipse cx="{{deep.b5.x}}" cy="{{deep.b5.y}}" rx="{{deep.b5.rx}}" ry="{{deep.b5.ry}}" fill="{{deep.b5.c}}" transform="rotate({{deep.b5.r}} {{deep.b5.x}} {{deep.b5.y}})"/></g><g filter="url(#{{deep.sid}})"><ellipse cx="{{deep.s0.x}}" cy="{{deep.s0.y}}" rx="{{deep.s0.rx}}" ry="{{deep.s0.ry}}" fill="{{deep.s0.c}}" transform="rotate({{deep.s0.r}} {{deep.s0.x}} {{deep.s0.y}})"/><ellipse cx="{{deep.s1.x}}" cy="{{deep.s1.y}}" rx="{{deep.s1.rx}}" ry="{{deep.s1.ry}}" fill="{{deep.s1.c}}" transform="rotate({{deep.s1.r}} {{deep.s1.x}} {{deep.s1.y}})"/></g></svg><svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; mix-blend-mode: soft-light; opacity: {{grain}}; pointer-events: none;"><filter id="sc-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="3.4" intercept="-1.2"/><feFuncG type="linear" slope="3.4" intercept="-1.2"/><feFuncB type="linear" slope="3.4" intercept="-1.2"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(#sc-grain)"/></svg></div>
    <div style="position: relative; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #FFFFFF;"><span style="display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 600; letter-spacing: -.02em;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M15.8 8.2a5.4 5.4 0 0 1 0 7.6M8.2 15.8a5.4 5.4 0 0 1 0-7.6M18.7 5.3a9.5 9.5 0 0 1 0 13.4M5.3 18.7a9.5 9.5 0 0 1 0-13.4"/></svg>Play live</span><a href="WebDeck.dc.html" aria-label="Close" onClick="{{close}}" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.3); color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>
    <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.9); text-shadow: {{deep.shadow}};">{{headLine}}</p>
    <sc-if value="{{choose}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 13px; font-weight: 600;">Questions from</span><div role="group" style="display: flex; padding: 4px; border-radius: 999px; background: {{t.surf}};"><sc-for list="{{froms}}" as="o" hint-placeholder-count="4"><button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="flex: 1 1 0; min-width: 0; height: 38px; padding: 0 6px; border: 0; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.sh}}; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;">{{o.label}}</button></sc-for></div></div></sc-if>
    <sc-if value="{{fromDeck}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 13px; font-weight: 600;">Cards</span><div role="group" style="display: flex; padding: 4px; border-radius: 999px; background: {{t.surf}};"><sc-for list="{{sets}}" as="o" hint-placeholder-count="4"><button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="flex: 1 1 0; min-width: 0; height: 38px; padding: 0 6px; border: 0; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.sh}}; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;">{{o.label}}</button></sc-for></div></div></sc-if>
    <sc-if value="{{fromTopic}}" hint-placeholder-val="{{ false }}"><label style="display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 13px; font-weight: 600;">Topic</span>
      <sc-if value="{{topicEdit}}" hint-placeholder-val="{{ true }}"><input type="text" value="{{topic}}" onChange="{{setTopic}}" onKeyDown="{{topicKey}}" ref="{{topicRef}}" placeholder="{{topicHint}}" aria-label="Topic" maxlength="120" autocomplete="off" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: 0; outline: 0; border-radius: 16px; background: {{t.surf}}; color: {{t.text}}; font: inherit; font-size: 16px;"></sc-if>
      <sc-if value="{{topicBusy}}" hint-placeholder-val="{{ false }}"><span style="height: 48px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; border-radius: 16px; background: {{t.surf}}; color: {{t.muted}}; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{topic}}</span></sc-if></label></sc-if>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;"><div style="display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 13px; font-weight: 600;">Questions</span><div role="group" style="display: flex; padding: 4px; border-radius: 999px; background: {{t.surf}};"><sc-for list="{{counts}}" as="o" hint-placeholder-count="4"><button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="flex: 1 1 0; min-width: 0; height: 38px; padding: 0 6px; border: 0; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.sh}}; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;">{{o.label}}</button></sc-for></div></div><div style="display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 13px; font-weight: 600;">Time for each</span><div role="group" style="display: flex; padding: 4px; border-radius: 999px; background: {{t.surf}};"><sc-for list="{{times}}" as="o" hint-placeholder-count="4"><button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="flex: 1 1 0; min-width: 0; height: 38px; padding: 0 6px; border: 0; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.sh}}; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;">{{o.label}}</button></sc-for></div></div></div>
    <sc-if value="{{noneLine}}" hint-placeholder-val="{{ false }}"><div style="font-size: 13px; line-height: 1.45; color: {{t.muted}};">{{noneLine}}</div></sc-if>
    <sc-if value="{{problem}}" hint-placeholder-val="{{ false }}"><div role="alert" style="font-size: 13px; line-height: 1.45; color: {{t.text}};">{{problem}}</div></sc-if>
    <div style="display: flex; gap: 10px;"><a href="WebDeck.dc.html" onClick="{{cancel}}" style="flex-grow: 1; height: 52px; border-radius: 999px; background: {{t.surf}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600;">Cancel</a><a href="LiveLobby.dc.html" onClick="{{open}}" data-key="Enter" style="flex-grow: 2; height: 52px; border-radius: 999px; background: {{openBg}}; color: {{openFg}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; cursor: {{openCursor}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M15.8 8.2a5.4 5.4 0 0 1 0 7.6M8.2 15.8a5.4 5.4 0 0 1 0-7.6M18.7 5.3a9.5 9.5 0 0 1 0 13.4M5.3 18.7a9.5 9.5 0 0 1 0-13.4"/></svg>{{openLabel}}</a></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"liveFrom":{"editor":"enum","default":"A deck","options":["A deck","A topic","A topic (from the Library)","Writing the questions","It didn’t work"]},"topic":{"editor":"string","default":""},"$preview":{"width":1440,"height":900}}'>
class Component extends LucidaLogic(DCLogic, 0) {

constructor(props) { super(props); this.state = { set: null, count: 10, time: 20, from: '', topic: null }; }
renderVals() { const t = this.theme(!!this.props.dark, !!this.props.dim);
  const db = this.props.db || this.mock(), s = this.state, id = this.props.deckId, P = this.props, mock = !!db.mock, F = P.liveFrom || 'A deck';
  const seg = (k, cur) => ({ pressed: k === cur ? 'true' : 'false', bg: k === cur ? t.bg : 'transparent', fg: k === cur ? t.text : t.muted, sh: k === cur ? '0 1px 3px rgba(0,0,0,.14)' : 'none' });
  const sets = db.liveSets(id), set = sets.find(x => x.id === s.set) || (mock ? sets[2] : sets.find(x => x.n > 0) || sets[sets.length - 1]), n = set.n;
  // Questions can come from the deck's cards or from a topic. With no deck (Live from the Library) it is always a topic; a deck with no
  // cards to play starts on the topic too. The canvas takes its pick from the board's "liveFrom" setting.
  const hasDeck = mock ? F !== 'A topic (from the Library)' : !!id;
  const from = !hasDeck ? 'topic' : mock ? (F === 'A deck' ? 'deck' : 'topic') : s.from || (n > 0 ? 'deck' : 'topic');
  const LT = mock ? { busy: F === 'Writing the questions', word: 'Writing your questions…', error: F === 'It didn’t work' ? 'The AI didn’t answer. Try again in a moment.' : '' } : db.liveTopic();
  const topic = s.topic != null ? s.topic : mock && from === 'topic' ? 'The French Revolution' : P.topic || '';
  const busy = from === 'topic' && LT.busy, ready = from === 'topic' ? topic.trim().length >= 2 && !LT.busy : n > 0;
  const go = e => { if (e && e.preventDefault) e.preventDefault(); if (mock) return; if (from === 'topic') { if (ready) db.act.openLiveTopic(topic, s.count, s.time); } else if (n) db.act.openLive(id, set.id, s.count, s.time); };
  return { t, deep: {"base":"linear-gradient(102deg, #14165A 0%, #20238A 17%, #1B2378 32%, #151D66 52%, #172372 70%, #123F86 86%, #0B6C9C 100%)","ink":"#FFFFFF","fid":"sc-flow-midnight","sid":"sc-streak-midnight","blur":"6","sblur":"2.2","disp":"10","glass":"rgba(255,255,255,.12)","glassLine":"rgba(255,255,255,.62)","shadow":"0 1px 14px rgba(0,0,0,.16)","b0":{"c":"#3440C4","x":14,"y":70,"rx":10,"ry":70,"r":12},"b1":{"c":"#1A2270","x":55,"y":40,"rx":12,"ry":80,"r":12},"b2":{"c":"#0E8CC6","x":102,"y":102,"rx":20,"ry":42,"r":18},"b3":{"c":"#262C8E","x":88,"y":0,"rx":22,"ry":26,"r":0},"b4":{"c":"#4450DA","x":6,"y":100,"rx":16,"ry":22,"r":12},"b5":{"c":"#1C2A80","x":72,"y":60,"rx":10,"ry":70,"r":12},"s0":{"c":"#5A64E6","x":1,"y":40,"rx":3.2,"ry":70,"r":12},"s1":{"c":"#3A47C0","x":44,"y":50,"rx":2.6,"ry":80,"r":12}}, dark: !!P.dark, dim: !!P.dim, deckId: id || '', grain: String(P.grain ?? 0.7),
    deckPage: hasDeck, libraryPage: !hasDeck,
    headLine: from === 'topic' ? 'Type a topic and Lucida writes the questions. Friends join on their phones with a code, no account needed. Right and fast answers win.' : 'Play this deck with friends. They join on their phones with a code, no account needed. Right and fast answers win.',
    choose: hasDeck, froms: [['deck', 'This deck'], ['topic', 'A topic']].map(([k, label]) => ({ label, ...seg(k, from), pick: () => { if (!busy) this.setState({ from: k }); } })),
    fromDeck: from === 'deck', fromTopic: from === 'topic', topic, topicEdit: !busy, topicBusy: busy, topicHint: 'The French Revolution',
    setTopic: e => this.setState({ topic: e && e.target ? e.target.value : '' }), topicKey: e => { if (e && e.key === 'Enter') go(e); },
    topicRef: el => { if (el && !mock && from === 'topic' && !this._focused) { this._focused = true; el.focus(); } },
    sets: sets.map(x => ({ label: x.label + ' · ' + x.n, ...seg(x.id, set.id), pick: () => this.setState({ set: x.id }) })),
    counts: [5, 10, 20].map(k => ({ label: String(k), ...seg(k, s.count), pick: () => { if (!busy) this.setState({ count: k }); } })),
    times: [10, 20, 30].map(k => ({ label: k + 's', ...seg(k, s.time), pick: () => { if (!busy) this.setState({ time: k }); } })),
    noneLine: from === 'deck' && !n ? 'Live needs two or more cards with answers. Sound cards don’t play live yet.' : '', problem: from === 'topic' ? LT.error || '' : '',
    openBg: ready ? t.inv : t.surf2, openFg: ready ? t.invText : t.muted, openCursor: ready ? 'pointer' : 'default', openLabel: busy ? LT.word || 'Writing your questions…' : 'Open the room',
    // Cancel stops the questions being written (and stays here); otherwise it closes, like the X.
    cancel: e => { if (mock) return; if (busy) { if (e && e.preventDefault) e.preventDefault(); db.act.cancelLiveTopic(); } },
    // The X closes the window, and stops the questions being written.
    close: () => { if (!mock && busy) db.act.cancelLiveTopic(); },
    open: go }; }
}
</script>
</body>
</html>
