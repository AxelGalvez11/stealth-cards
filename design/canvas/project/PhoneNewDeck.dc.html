<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Geist, -apple-system, system-ui, sans-serif; color: {{t.text}};">

    <div style="position: relative; height: 132px; border-radius: 26px; flex-shrink: 0; overflow: hidden; background: {{t.bg}}; box-shadow: inset 0 0 0 1px {{t.line}}; color: {{coverInk}}; transition: color 2s ease;">
      <div style="position: absolute; inset: 0; display: {{prevShow}}; background: {{prev.base}};"><svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" style="position: absolute; inset: 0; pointer-events: none;"><defs><filter id="{{prev.fid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="{{prev.disp}}" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="{{prev.blur}}"/></filter><filter id="{{prev.sid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="{{prev.sblur}}"/></filter></defs><g filter="url(#{{prev.fid}})"><ellipse cx="{{prev.b0.x}}" cy="{{prev.b0.y}}" rx="{{prev.b0.rx}}" ry="{{prev.b0.ry}}" fill="{{prev.b0.c}}" transform="rotate({{prev.b0.r}} {{prev.b0.x}} {{prev.b0.y}})"/><ellipse cx="{{prev.b1.x}}" cy="{{prev.b1.y}}" rx="{{prev.b1.rx}}" ry="{{prev.b1.ry}}" fill="{{prev.b1.c}}" transform="rotate({{prev.b1.r}} {{prev.b1.x}} {{prev.b1.y}})"/><ellipse cx="{{prev.b2.x}}" cy="{{prev.b2.y}}" rx="{{prev.b2.rx}}" ry="{{prev.b2.ry}}" fill="{{prev.b2.c}}" transform="rotate({{prev.b2.r}} {{prev.b2.x}} {{prev.b2.y}})"/><ellipse cx="{{prev.b3.x}}" cy="{{prev.b3.y}}" rx="{{prev.b3.rx}}" ry="{{prev.b3.ry}}" fill="{{prev.b3.c}}" transform="rotate({{prev.b3.r}} {{prev.b3.x}} {{prev.b3.y}})"/><ellipse cx="{{prev.b4.x}}" cy="{{prev.b4.y}}" rx="{{prev.b4.rx}}" ry="{{prev.b4.ry}}" fill="{{prev.b4.c}}" transform="rotate({{prev.b4.r}} {{prev.b4.x}} {{prev.b4.y}})"/><ellipse cx="{{prev.b5.x}}" cy="{{prev.b5.y}}" rx="{{prev.b5.rx}}" ry="{{prev.b5.ry}}" fill="{{prev.b5.c}}" transform="rotate({{prev.b5.r}} {{prev.b5.x}} {{prev.b5.y}})"/></g><g filter="url(#{{prev.sid}})"><ellipse cx="{{prev.s0.x}}" cy="{{prev.s0.y}}" rx="{{prev.s0.rx}}" ry="{{prev.s0.ry}}" fill="{{prev.s0.c}}" transform="rotate({{prev.s0.r}} {{prev.s0.x}} {{prev.s0.y}})"/><ellipse cx="{{prev.s1.x}}" cy="{{prev.s1.y}}" rx="{{prev.s1.rx}}" ry="{{prev.s1.ry}}" fill="{{prev.s1.c}}" transform="rotate({{prev.s1.r}} {{prev.s1.x}} {{prev.s1.y}})"/></g></svg><svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; mix-blend-mode: soft-light; opacity: {{grain}}; pointer-events: none;"><filter id="sc-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="3.4" intercept="-1.2"/><feFuncG type="linear" slope="3.4" intercept="-1.2"/><feFuncB type="linear" slope="3.4" intercept="-1.2"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(#sc-grain)"/></svg></div><div class="sc-cover-in" style="position: absolute; inset: 0; display: {{coverShow}}; background: {{cover.base}}; animation: {{coverFade}};"><svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" style="position: absolute; inset: 0; pointer-events: none;"><defs><filter id="{{cover.fid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="{{cover.disp}}" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="{{cover.blur}}"/></filter><filter id="{{cover.sid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="{{cover.sblur}}"/></filter></defs><g filter="url(#{{cover.fid}})"><ellipse cx="{{cover.b0.x}}" cy="{{cover.b0.y}}" rx="{{cover.b0.rx}}" ry="{{cover.b0.ry}}" fill="{{cover.b0.c}}" transform="rotate({{cover.b0.r}} {{cover.b0.x}} {{cover.b0.y}})"/><ellipse cx="{{cover.b1.x}}" cy="{{cover.b1.y}}" rx="{{cover.b1.rx}}" ry="{{cover.b1.ry}}" fill="{{cover.b1.c}}" transform="rotate({{cover.b1.r}} {{cover.b1.x}} {{cover.b1.y}})"/><ellipse cx="{{cover.b2.x}}" cy="{{cover.b2.y}}" rx="{{cover.b2.rx}}" ry="{{cover.b2.ry}}" fill="{{cover.b2.c}}" transform="rotate({{cover.b2.r}} {{cover.b2.x}} {{cover.b2.y}})"/><ellipse cx="{{cover.b3.x}}" cy="{{cover.b3.y}}" rx="{{cover.b3.rx}}" ry="{{cover.b3.ry}}" fill="{{cover.b3.c}}" transform="rotate({{cover.b3.r}} {{cover.b3.x}} {{cover.b3.y}})"/><ellipse cx="{{cover.b4.x}}" cy="{{cover.b4.y}}" rx="{{cover.b4.rx}}" ry="{{cover.b4.ry}}" fill="{{cover.b4.c}}" transform="rotate({{cover.b4.r}} {{cover.b4.x}} {{cover.b4.y}})"/><ellipse cx="{{cover.b5.x}}" cy="{{cover.b5.y}}" rx="{{cover.b5.rx}}" ry="{{cover.b5.ry}}" fill="{{cover.b5.c}}" transform="rotate({{cover.b5.r}} {{cover.b5.x}} {{cover.b5.y}})"/></g><g filter="url(#{{cover.sid}})"><ellipse cx="{{cover.s0.x}}" cy="{{cover.s0.y}}" rx="{{cover.s0.rx}}" ry="{{cover.s0.ry}}" fill="{{cover.s0.c}}" transform="rotate({{cover.s0.r}} {{cover.s0.x}} {{cover.s0.y}})"/><ellipse cx="{{cover.s1.x}}" cy="{{cover.s1.y}}" rx="{{cover.s1.rx}}" ry="{{cover.s1.ry}}" fill="{{cover.s1.c}}" transform="rotate({{cover.s1.r}} {{cover.s1.x}} {{cover.s1.y}})"/></g></svg><svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; mix-blend-mode: soft-light; opacity: {{grain}}; pointer-events: none;"><filter id="sc-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="3.4" intercept="-1.2"/><feFuncG type="linear" slope="3.4" intercept="-1.2"/><feFuncB type="linear" slope="3.4" intercept="-1.2"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(#sc-grain)"/></svg></div><sc-if value="{{skinCover.on}}" hint-placeholder-val="{{ false }}"><div ref="{{skinCover.art}}" data-sc-own aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden;"></div></sc-if><sc-if value="{{coverIsImage}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; background: repeating-linear-gradient(135deg, {{t.surf}} 0 14px, {{t.surf2}} 14px 28px); display: flex; align-items: center; justify-content: center; gap: 8px; color: {{t.muted}}; font-size: 14px; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>[Your header image]</div></sc-if>
    <sc-if value="{{coverHasPhoto}}" hint-placeholder-val="{{ false }}"><img src="{{coverPhoto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;"></sc-if>
      <div style="position: relative; height: 100%; box-sizing: border-box; padding: 14px 16px 16px 18px; display: flex; flex-direction: column; justify-content: space-between; text-shadow: {{coverShadow}};"><div style="display: flex; justify-content: flex-end; gap: 8px;"><button type="button" onClick="{{shuffle}}" style="height: 36px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: rgba(255,255,255,.62); color: #000000; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2.2 0 3.4 1.1 4.6 3l1.8 3c1.2 1.9 2.4 3 4.6 3H21M3 17h3.5c1.4 0 2.4-.4 3.3-1.3M14.2 8.3c.9-.9 1.9-1.3 3.3-1.3H21M18 4l3 3-3 3M18 13l3 3-3 3"/></svg>Shuffle</button><button type="button" onClick="{{pickCover}}" style="height: 36px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: rgba(255,255,255,.62); color: #000000; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Image</button></div><label style="display: block; min-width: 0; margin: -2px -8px; padding: 2px 8px; border-radius: 12px;"><span style="position: absolute; left: -9999px;">Deck name</span><input type="text" value="{{name}}" onChange="{{setName}}" placeholder="Untitled deck" maxlength="120" autocomplete="off" class="sc-cover-name" style="display: block; width: 100%; box-sizing: border-box; margin: 0; padding: 0; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.25; text-shadow: inherit; text-overflow: ellipsis; {{coverTitleS}}"></label></div>
    </div>
    <div style="display: flex; gap: 10px;"><a href="PhoneLibrary.dc.html" style="flex-grow: 1; height: 52px; border-radius: 999px; background: {{t.surf}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">Cancel</a><a href="PhoneDeckEmpty.dc.html" onClick="{{create}}" style="flex-grow: 2; height: 52px; border-radius: 999px; background: {{t.inv}}; color: {{t.invText}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">Create deck</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"grain":{"editor":"range","default":0.7,"min":0,"max":1,"step":0.05},"$preview":{"width":390,"height":844}}'>
class Component extends LucidaLogic(DCLogic, 0) {

constructor(props) { super(props); this.state = { name: 'Pharmacology', round: 0, shown: null, prev: null, k: 0 }; }
renderVals() {
  const t = this.theme(!!this.props.dark, !!this.props.dim);const db = this.props.db || this.mock(); const chrome = db.chrome();
  const s = this.state, st = db.settings();
  // The cover's colors come from a seed (the name, plus the Shuffle count). show() fades a new seed in over the one before;
  // the one underneath goes once the fade is done.
  const seedOf = (n, r) => ((n || '').trim() || 'Untitled deck') + (r ? ' #' + r : '');
  const show = (seed, more = {}) => {
    const k = this.state.k + 1;
    this.setState({ ...more, prev: this.state.shown, shown: seed, k });
    clearTimeout(this.faded); this.faded = setTimeout(() => { if (this.state.k === k) this.setState({ prev: null }); }, 2100);
  };
  // A new deck takes your Settings' new cards a day, remember goal and grading, which Deck settings → Studying changes (the owner, 2026-10-02, on
  // New deck's two steppers: "remove this from 'new deck' screens"). Its name is typed on the cover itself (the owner, 2026-10-02: "remove 'name' section, allow users to directly edit the name in the box
  // above"); decks have no tags, only cards do.
  const name = db.mock ? s.name : s.name === 'Pharmacology' && s.typed == null ? '' : s.name;
  const perDay = st.perDay, goal = st.goal;
  const title = (name || '').trim() || 'Untitled deck';
  const img = s.image || '', photo = img !== 'mock' ? img : '';
  const S = this.skin(db), C = S && !img ? S.coverOf({ seed: s.shown ? s.shown.replace(/ #d+$/, '') : title, name: title, round: s.round, tags: [] }, 'wide', 26) : null;
  const typed = (id, value, save, label) => {
    const draft = (this.state.numDraft || {})[id];
    const keep = v => this.setState({ numDraft: { ...(this.state.numDraft || {}), [id]: v } });
    return { text: draft != null ? draft : String(value), label,
      type: e => { const v = String(e.target.value).replace(/\D/g, '').slice(0, 3); if (e.target.value !== v) e.target.value = v; keep(v); if (v !== '') save(+v); },
      focus: e => { const el = e.target; setTimeout(() => el.setSelectionRange && el.setSelectionRange(0, el.value.length), 0); },
      done: () => keep(null),
      key: e => { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); e.target.blur(); } } };
  };
  return {
    t, dark: !!this.props.dark, dim: !!this.props.dim, grain: String(this.props.grain ?? 0.7),
    name,
    coverShow: s.shown ? 'block' : 'none', prevShow: s.prev ? 'block' : 'none', cover: this.gen(s.shown || seedOf(title, s.round), st.grads), prev: this.gen(s.prev || seedOf(title, s.round), st.grads),
    coverFade: s.k % 2 ? 'scCoverA 2s ease-in-out both' : 'scCoverB 2s ease-in-out both',
    coverIsImage: img === 'mock', coverHasPhoto: !!photo, coverPhoto: photo,
    coverInk: photo ? '#FFFFFF' : img ? t.text : C ? C.ink : s.shown ? this.gen(s.shown, st.grads).ink : t.text, coverShadow: photo ? '0 1px 14px rgba(0,0,0,.45)' : !img && s.shown && !C ? this.gen(s.shown, st.grads).shadow : 'none',
    // With a theme on (Pro), the theme's cover for this name (the one the deck gets), which changes once you stop typing.
    skinCover: C ? { on: true, art: C.art } : { on: false, art: null }, coverTitle: C ? C.titleAt(26) : '', coverTitleS: C ? C.titleAt(22) : '',
    // A moment after you stop typing a name, its colors fade in.
    setName: e => {
      const v = e && e.target ? e.target.value : s.name;
      this.setState({ name: v, typed: true });
      clearTimeout(this.settle);
      this.settle = setTimeout(() => { const seed = seedOf(v, this.state.round); if (v.trim() && seed !== this.state.shown) show(seed); }, 800);
    },
    shuffle: () => show(seedOf(name, s.round + 1), { round: s.round + 1, image: null }), noop: () => {},
    pickCover: () => (db.mock ? Promise.resolve('mock') : db.act.pickFile('image')).then(url => url && this.setState({ image: url })),
    // On a computer the name field is ready to type in when New deck opens (in the app; a phone's keyboard waits for a tap).
    nameRef: el => { if (!el || db.mock || this.nameFocused) return; this.nameFocused = true; el.focus(); },
    create: e => { if (db.mock) return; e.preventDefault(); db.act.addDeck({ name: title, perDay, goal, style: st.grads, round: s.round, image: s.image || null }); }
  };
}
}
</script>
