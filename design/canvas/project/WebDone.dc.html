<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web · Session done</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: Geist, -apple-system, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}};">
  <div style="width: 560px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;"><div style="position: relative; width: 300px; height: 163px;"><svg width="300" height="163" viewBox="0 0 300 163" aria-hidden="true"><defs><linearGradient id="sc-meter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{{meter.a}}"/><stop offset="1" stop-color="{{meter.b}}"/></linearGradient></defs><path d="M 17.0 150.0 A 133.0 133.0 0 0 1 283.0 150.0" fill="none" stroke="{{t.surf2}}" stroke-width="22" stroke-linecap="round"/><path d="M 17.0 150.0 A 133.0 133.0 0 0 1 {{meter.x}} {{meter.y}}" fill="none" stroke="url(#sc-meter)" stroke-width="22" stroke-linecap="round" pathLength="1" class="sc-draw"/><circle class="sc-knob" cx="{{meter.x}}" cy="{{meter.y}}" r="16.0" fill="{{t.bg}}" stroke="{{meter.b}}" stroke-width="4"/></svg><div role="img" aria-label="{{meter.pct}}% remembered" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;"><span style="font-size: 60px; font-weight: 600; letter-spacing: -.04em; line-height: 1;">{{meter.pct}}%</span><span style="font-size: 13px; color: {{t.muted}};">remembered</span></div></div><span style="font-size: 14px; font-weight: 600; color: {{meter.ink}};">{{goalLine}}</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px;"><h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -.03em;">Session complete</h1><div style="font-size: 16px; color: {{t.muted}};">{{summary}}</div></div>
    <div style="width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left;"><div style="display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 3px;"><div style="width: {{split.w0}}; background: {{t.again}};"></div><div style="width: {{split.w1}}; background: {{t.hard}};"></div><div style="width: {{split.w2}}; background: {{t.good}};"></div><div style="width: {{split.w3}}; background: {{t.easy}};"></div></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: 13px; color: {{t.muted}};"><span>Forgot {{split.n0}}</span><span>Hard {{split.n1}}</span><span>Good {{split.n2}}</span><span>Easy {{split.n3}}</span></div></div>
    <div style="width: 100%; display: flex; gap: 12px;">
      <div style="flex-grow: 1; background: {{t.surf}}; border-radius: 16px; padding: 18px; text-align: left; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; color: {{t.muted}};">Streak</span><span style="font-size: 22px; font-weight: 600;">{{streakLabel}}</span></div>
      <div style="flex-grow: 1; background: {{t.surf}}; border-radius: 16px; padding: 18px; text-align: left; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; color: {{t.muted}};">Next review</span><span style="font-size: 22px; font-weight: 600;">{{nextLabel}}</span></div>
    </div>
    <div style="width: 100%; display: flex; gap: 10px;"><a href="{{moreHref}}" style="flex-grow: 1; height: 52px; border-radius: 999px; background: {{t.surf}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">{{moreLabel}}</a><a href="{{doneHref}}" style="flex-grow: 1; height: 52px; border-radius: 999px; background: {{t.inv}}; color: {{t.invText}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">Done</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends LucidaLogic(DCLogic, 0) {
renderVals() { const t = this.theme(!!this.props.dark, !!this.props.dim);const db = this.props.db || this.mock(); const chrome = db.chrome();
  const ss = db.session();
  const mr = 133, mcx = 150, mcy = 150;
  const mAng = Math.PI * (1 - Math.max(0.001, Math.min(0.999, ss.pct / 100)));
  const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's'), tot = ss.split.reduce((a, b) => a + b, 0) || 1;
  const pct = n => Math.round(n / tot * 100) + '%', w = ss.splitW || ss.split.map(pct);
  return { t, ...chrome, meter: { ...(this.props.dark ? { a: '#3A4BB0', b: '#8C9AFC', ink: '#8C9AFC' } : { a: '#B0BAFB', b: '#4353E0', ink: '#4353E0' }), pct: String(ss.pct), x: (mcx + mr * Math.cos(mAng)).toFixed(1), y: (mcy - mr * Math.sin(mAng)).toFixed(1) },
    goalLine: ss.pct > ss.goal ? 'Above your ' + ss.goal + '% goal' : ss.pct === ss.goal ? 'Right at your ' + ss.goal + '% goal' : 'Below your ' + ss.goal + '% goal',
    summary: plural(ss.cards, 'card') + ' · ' + plural(ss.minutes, 'minute') + ' · ' + plural(ss.fresh, 'new card') + ' learned',
    summaryShort: plural(ss.cards, 'card') + ' · ' + ss.minutes + ' min · ' + ss.fresh + ' new learned',
    split: { w0: w[0], w1: w[1], w2: w[2], w3: w[3], n0: String(ss.split[0]), n1: String(ss.split[1]), n2: String(ss.split[2]), n3: String(ss.split[3]) },
    streakLabel: plural(ss.streak, 'day'), nextLabel: ss.next, nextShort: ss.next.split(' · ')[0],
    moreHref: ss.moreHref, moreLabel: ss.moreLabel || 'Study 10 more', doneHref: db.mock ? 'WebDeck.dc.html' : ss.doneHref }; }
}
</script>
</body>
</html>
