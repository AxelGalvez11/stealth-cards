ms: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg></span><span style="font-size: 14px; font-weight: 600; white-space: nowrap;">Connect AI</span></a></div>
</div></div>
<nav style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 64px; box-sizing: border-box; padding: 6px; border-radius: 999px; background: {{t.surf}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;">
  <a href="PhoneLibrary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; font-size: 11px; font-weight: 600; background: {{t.inv}}; color: {{t.invText}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg>Library</a>
  <a href="PhoneDiscover.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; font-size: 11px; font-weight: 600; color: {{t.muted}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</a>
  <a href="PhoneStats.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; font-size: 11px; font-weight: 600; color: {{t.muted}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg>Stats</a>
  <a href="PhoneProfile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; font-size: 11px; font-weight: 600; color: {{t.muted}};"><span style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;"><span style="position: relative; width: 22px; height: 22px; flex-shrink: 0; display: flex;"><span style="position: relative; width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; overflow: hidden; background: {{me.bg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600;"><sc-if value="{{me.color}}" hint-placeholder-val="{{ true }}">{{me.initial}}</sc-if><sc-if value="{{me.photo}}" hint-placeholder-val="{{ false }}"><img src="{{me.photo}}" alt="" referrerpolicy="no-referrer" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;"></sc-if><sc-if value="{{me.sampleGoogle}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Google profile photo" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; overflow: hidden; background: linear-gradient(160deg, #FFD9A8 0%, #F59E6B 55%, #D9677A 100%); display: flex;"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="26" r="11" fill="rgba(255,255,255,.92)"/><path d="M11 64c1.5-12 10-19 21-19s19.5 7 21 19z" fill="rgba(255,255,255,.92)"/></svg></span></sc-if><sc-if value="{{me.sampleYours}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Your profile photo" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; overflow: hidden; background: linear-gradient(160deg, #B8F0D8 0%, #4FC3B0 50%, #3A7BD5 100%); display: flex;"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="26" r="11" fill="rgba(255,255,255,.92)"/><path d="M11 64c1.5-12 10-19 21-19s19.5 7 21 19z" fill="rgba(255,255,255,.92)"/></svg></span></sc-if></span><sc-if value="{{me.skinned}}" hint-placeholder-val="{{ false }}"><span ref="{{me.art}}" data-sc-own aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; pointer-events: none;"></span></sc-if></span></span>Profile</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"grain":{"editor":"range","default":0.7,"min":0,"max":1,"step":0.05},"$preview":{"width":390,"height":844}}'>
class Component extends LucidaLogic(DCLogic, 0) {
renderVals() { const t = this.theme(!!this.props.dark, !!this.props.dim);const db = this.props.db || this.mock(); const chrome = db.chrome();
  // The Library with no decks yet still has its switch, so Classes are there before the first deck (web/classes.mjs).
  const modes = [['Decks', 'PhoneLibrary', '/library'], ['All cards', 'PhoneLibraryCards', '/library/cards'], ['Classes', 'PhoneClasses', '/library/classes']]
    .map(([label, b, href], i) => ({ label, href: db.mock ? b + '.dc.html' : href, current: !i ? 'page' : 'false', bg: !i ? t.bg : 'transparent', fg: !i ? t.text : t.muted, sh: !i ? '0 1px 3px rgba(0,0,0,.14)' : 'none' }));
  // On the canvas these boards show a brand-new account, so there is no news yet.
  const dk = db.mock ? { id: '', name: '', seed: '', cover: { style: null, round: 0, image: null } } : (db.deck(this.props.deckId) || { id: '', name: '', seed: '', cover: {} });
  // A new deck's picture shows on its empty page too, with white words over it.
  const pic = dk.cover.image || '', photo = pic !== 'mock' ? pic : '';
  // With a theme on (Pro), the theme draws the cover, and letters the deck's name.
  const S = this.skin(db), C = S && !pic && dk.name ? S.coverOf({ ...dk, round: dk.cover.round }, 'head', 34) : null;
  const DAYS7 = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const todayAt = db.mock ? new Date(2026, 8, 28).getTime() : new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()).getTime();
  const addDays = n => { const d = new Date(todayAt); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n).getTime(); };
  const dateAt = v => { const x = String(v || '').split('-').map(Number); return new Date(x[0] || 2026, (x[1] || 1) - 1, x[2] || 1).getTime(); };
  const isoDay = at => { const d = new Date(at); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const dayWord = v => { const at = dateAt(v), n = Math.round((at - todayAt) / 86400000), d = new Date(at);
    return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : Math.abs(n) < 7 ? DAYS7[d.getDay()] : MON3[d.getMonth()] + ' ' + d.getDate(); };
  const dueWord = (goal, v) => (dateAt(v) < todayAt ? 'was due ' : goal === 'daily' ? 'until ' : 'due ') + dayWord(v);
  const goalWord = g => (g === 'daily' ? 'Review what’s due' : 'Learn every card');
  const nOf = (n, w, ws) => n + ' ' + (n === 1 ? w : ws || w + 's');
  const andList = a => (a.length < 2 ? a.join('') : a.length === 2 ? a.join(' and ') : a.slice(0, -1).join(', ') + ', and ' + a[a.length - 1]);
  // What's left for you on an assignment, from your own cards: 12 cards left, 4 to review, Caught up, Done.
  const leftWord = (a, pr) => (!pr ? (a.goal === 'daily' ? 'Not started' : nOf(a.cards || 0, 'card'))
    : a.goal === 'daily' ? (!pr.learned ? 'Not started' : pr.due ? pr.due + ' to review' : 'Caught up') : pr.total && pr.learned >= pr.total ? 'Done' : nOf(Math.max(0, pr.total - pr.learned), 'card') + ' left');
  const isDone = (a, pr) => !!pr && (a.goal === 'daily' ? pr.learned > 0 && !pr.due : pr.total > 0 && pr.learned >= pr.total);
  const assignRows = (db.assignments ? db.assignments() : []).map(a => { const g = this.gen((a.cover && a.cover.seed) || a.name, (a.cover && a.cover.style) || 'mix'), left = leftWord(a, a.progress), done = isDone(a, a.progress), when = dueWord(a.goal, a.due);
    return { name: a.name, className: a.className, text: a.name + ' · ' + when + ' · ' + left, sub: when + ' · ' + a.className, left, dot: g.base, textColor: done ? t.muted : t.text, leftColor: done ? t.good : t.text,
      href: db.mock ? 'PhoneDeck.dc.html' : a.progress ? '/deck/' + a.progress.deckId : '/class/' + a.code }; });
  return { hero: this.mesh(this.props.gradient ?? 'Iris'), grain: String(this.props.grain ?? 0.7), t, ...chrome, modes, assignments: assignRows, hasAssignments: assignRows.length > 0, nav: db.mock ? { ...chrome.nav, news: '', hasNews: false } : chrome.nav, art: this.mesh('Iris'), art2: this.mesh('Mint'), art3: this.mesh('Apricot'), noop: () => {},
    deckName: dk.name, cover: { ...this.gen(dk.seed + (dk.cover.round ? ' #' + dk.cover.round : ''), dk.cover.style), ...(photo ? { ink: '#FFFFFF', shadow: '0 1px 14px rgba(0,0,0,.45)' } : {}),
      ...(C ? { base: C.base, ink: C.ink, shadow: 'none', plain: false, skin: true, art: C.art } : { plain: true, skin: false, art: null }) },
    coverTitle: C ? C.titleAt(34) : '', coverTitleS: C ? C.titleHead(32, dk.name) : '',
    coverIsImage: pic === 'mock', coverHasPhoto: !!photo, coverPhoto: photo,
    newDeckHref: db.mock ? 'PhoneNewDeck.dc.html' : db.href('newDeck'), importHref: db.mock ? 'PhoneImport.dc.html' : db.href('import', ''), connectHref: db.mock ? 'PhoneConnect.dc.html' : db.href('connect'),
    openSettings: () => { if (!db.mock) db.act.go(dk.settingsHref); } }; }
}
</script>
