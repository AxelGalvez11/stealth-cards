<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone · Session done · piles</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; font-family: Geist, -apple-system, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}; overflow: hidden;">
<div style="height: 100%; overflow-x: hidden; overflow-y: auto; scrollbar-width: none;"><div style="height: 100%; box-sizing: border-box; padding: 64px 20px 34px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center;">
  <div role="list" aria-label="Your piles" style="width: 100%; display: flex; flex-wrap: wrap; gap: 8px;"><sc-for list="{{piles}}" as="p" hint-placeholder-count="3"><a role="listitem" href="{{p.href}}" aria-label="Go over {{p.name}}" style="flex: 1 1 96px; min-width: 0; position: relative; box-sizing: border-box; padding: 16px 14px 14px; border-radius: 22px; background: {{t.surf}}; display: flex; flex-direction: column; gap: 4px; text-align: left; pointer-events: {{p.pe}};"><span style="position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%; background: {{t.bg}}; color: {{p.arrow}}; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span><span style="font-size: 34px; font-weight: 600; letter-spacing: -.03em; line-height: 1;">{{p.count}}</span><span style="font-size: 13px; font-weight: 600; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.name}}</span><div style="margin-top: 8px; height: 6px; border-radius: 3px; background: {{t.surf2}}; overflow: hidden;"><div style="height: 6px; border-radius: 3px; width: {{p.w}}; background: {{fill}};"></div></div></a></sc-for></div>
  <div style="display: flex; flex-direction: column; gap: 6px;"><div style="font-size: 30px; font-weight: 700; letter-spacing: -.03em;">Session complete</div><div style="font-size: 15px; color: {{t.muted}};">{{summaryShort}}</div></div>
  
  <div style="width: 100%; display: flex; gap: 8px;"><div style="flex-grow: 1; background: {{t.surf}}; border-radius: 22px; padding: 14px; text-align: left;"><div style="font-size: 12px; color: {{t.muted}};">Streak</div><div style="font-size: 20px; font-weight: 700;">{{streakLabel}}</div></div><div style="flex-grow: 1; background: {{t.surf}}; border-radius: 22px; padding: 14px; text-align: left;"><div style="font-size: 12px; color: {{t.muted}};">Next</div><div style="font-size: 20px; font-weight: 700;">{{nextShort}}</div></div></div>
  <div style="flex-grow: 1;"></div>
  <a href="{{doneHref}}" style="width: 100%; height: 58px; border-radius: 999px; background: {{t.inv}}; color: {{t.invText}}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">Done</a>
</div></div>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends LucidaLogic(DCLogic, 0) {
renderVals() { const t = this.theme(!!this.props.dark, !!this.props.dim);const db = this.props.db || this.mock(); const chrome = db.chrome();
  const ss = db.session(), plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's'), all = Math.max(1, ss.sorted);
  const ink = this.props.dark ? ['#3A4BB0', '#8C9AFC'] : ['#B0BAFB', '#4353E0'];
  return { t, ...chrome, fill: 'linear-gradient(90deg, ' + ink[0] + ', ' + ink[1] + ')',
    // Each pile opens a review of just the cards in it (an empty pile can't be opened).
    piles: ss.piles.map(p => ({ name: p.name, count: String(p.n), w: Math.round(p.n / all * 100) + '%', href: p.href || 'WebReview.dc.html', pe: p.total === 0 ? 'none' : 'auto', arrow: p.total === 0 ? t.surf2 : t.text })),
    summary: plural(ss.sorted, 'card') + ' sorted · ' + plural(ss.minutes, 'minute'), summaryShort: ss.sorted + ' sorted · ' + ss.minutes + ' min',
    streakLabel: plural(ss.streak, 'day'), nextLabel: ss.next, nextShort: ss.next.split(' · ')[0],
    moreHref: ss.moreHref, moreLabel: ss.moreLabel || 'Study 10 more', doneHref: db.mock ? 'PhoneDeck.dc.html' : ss.doneHref }; }
}
</script>
</body>
</html>
