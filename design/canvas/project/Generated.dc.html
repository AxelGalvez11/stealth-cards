<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Generated gradients</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 48px 56px; display: flex; flex-direction: column; gap: 24px; font-family: Geist, -apple-system, system-ui, sans-serif; background: #FFFFFF; color: #000000;">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 6px;"><h1 style="margin: 0; font-size: 40px; font-weight: 600; letter-spacing: -.035em;">Every deck gets its own gradient</h1><p style="margin: 0; font-size: 15px; color: #666666; max-width: 760px;">Made from the deck’s name, so it looks the same on every device. Mix is mostly vivid, with some deep ones.</p></div>
    <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
      <div role="group" aria-label="Style" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #F4F4F4;">
        <sc-for list="{{styles}}" as="m" hint-placeholder-count="3"><button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; background: {{m.bg}}; color: {{m.fg}}; box-shadow: {{m.sh}};">{{m.label}}</button></sc-for>
      </div>
      <button type="button" onClick="{{shuffle}}" style="height: 44px; padding: 0 20px; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; background: #000000; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2.2 0 3.4 1.1 4.6 3l1.8 3c1.2 1.9 2.4 3 4.6 3H21M3 17h3.5c1.4 0 2.4-.4 3.3-1.3M14.2 8.3c.9-.9 1.9-1.3 3.3-1.3H21M18 4l3 3-3 3M18 13l3 3-3 3"/></svg>Shuffle</button>
    </div>
  </div>
  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 16px;">
    <sc-for list="{{cards}}" as="d" hint-placeholder-count="12">
      <div style="position: relative; overflow: hidden; color: {{d.ink}}; background: {{d.base}}; border-radius: 28px;"><svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" style="position: absolute; inset: 0; pointer-events: none;"><defs><filter id="{{d.fid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="{{d.disp}}" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="{{d.blur}}"/></filter><filter id="{{d.sid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="{{d.sblur}}"/></filter></defs><g filter="url(#{{d.fid}})"><ellipse cx="{{d.b0.x}}" cy="{{d.b0.y}}" rx="{{d.b0.rx}}" ry="{{d.b0.ry}}" fill="{{d.b0.c}}" transform="rotate({{d.b0.r}} {{d.b0.x}} {{d.b0.y}})"/><ellipse cx="{{d.b1.x}}" cy="{{d.b1.y}}" rx="{{d.b1.rx}}" ry="{{d.b1.ry}}" fill="{{d.b1.c}}" transform="rotate({{d.b1.r}} {{d.b1.x}} {{d.b1.y}})"/><ellipse cx="{{d.b2.x}}" cy="{{d.b2.y}}" rx="{{d.b2.rx}}" ry="{{d.b2.ry}}" fill="{{d.b2.c}}" transform="rotate({{d.b2.r}} {{d.b2.x}} {{d.b2.y}})"/><ellipse cx="{{d.b3.x}}" cy="{{d.b3.y}}" rx="{{d.b3.rx}}" ry="{{d.b3.ry}}" fill="{{d.b3.c}}" transform="rotate({{d.b3.r}} {{d.b3.x}} {{d.b3.y}})"/><ellipse cx="{{d.b4.x}}" cy="{{d.b4.y}}" rx="{{d.b4.rx}}" ry="{{d.b4.ry}}" fill="{{d.b4.c}}" transform="rotate({{d.b4.r}} {{d.b4.x}} {{d.b4.y}})"/><ellipse cx="{{d.b5.x}}" cy="{{d.b5.y}}" rx="{{d.b5.rx}}" ry="{{d.b5.ry}}" fill="{{d.b5.c}}" transform="rotate({{d.b5.r}} {{d.b5.x}} {{d.b5.y}})"/></g><g filter="url(#{{d.sid}})"><ellipse cx="{{d.s0.x}}" cy="{{d.s0.y}}" rx="{{d.s0.rx}}" ry="{{d.s0.ry}}" fill="{{d.s0.c}}" transform="rotate({{d.s0.r}} {{d.s0.x}} {{d.s0.y}})"/><ellipse cx="{{d.s1.x}}" cy="{{d.s1.y}}" rx="{{d.s1.rx}}" ry="{{d.s1.ry}}" fill="{{d.s1.c}}" transform="rotate({{d.s1.r}} {{d.s1.x}} {{d.s1.y}})"/></g></svg><svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; mix-blend-mode: soft-light; opacity: {{grain}}; pointer-events: none;"><filter id="sc-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="3.4" intercept="-1.2"/><feFuncG type="linear" slope="3.4" intercept="-1.2"/><feFuncB type="linear" slope="3.4" intercept="-1.2"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(#sc-grain)"/></svg><div style="position: relative; text-shadow: {{d.shadow}}; height: 100%; box-sizing: border-box; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between;"><span style="font-size: 12px; font-weight: 600; opacity: .8;">{{d.style}}</span><span style="font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15;">{{d.name}}</span></div></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"grain":{"editor":"range","default":0.7,"min":0,"max":1,"step":0.05},"$preview":{"width":1440,"height":900}}'>
class Component extends LucidaLogic(DCLogic, 0) {

constructor(props) { super(props); this.state = { round: 0, style: 'mix' }; }
renderVals() {
  const s = this.state;
  const names = ["Pharmacology","Cell Biology","Japanese · JLPT N4","Organic Chemistry","US History","Spanish Verbs","Anatomy","Calculus","Art History","Biochemistry","French","Physics"];
  const cards = names.map(name => {
    const d = this.gen(name + (s.round ? ' #' + s.round : ''), s.style);
    return { ...d, name, style: d.kind };
  });
  return {
    grain: String(this.props.grain ?? 0.7), cards,
    styles: [['mix', 'Mix'], ['vivid', 'Vivid'], ['deep', 'Deep']].map(([id, label]) => ({ label, pressed: id === s.style ? 'true' : 'false', bg: id === s.style ? '#FFFFFF' : 'transparent', fg: id === s.style ? '#000000' : '#666666', sh: id === s.style ? '0 1px 3px rgba(0,0,0,.14)' : 'none', pick: () => this.setState({ style: id }) })),
    shuffle: () => this.setState({ round: s.round + 1 })
  };
}
}
</script>
</body>
</html>
