<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web · Deck page · Make cards, opened from the deck (it stays behind)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden;"><dc-import name="WebMake" on-deck="{{yes}}" step="{{step}}" hint-size="1440px,900px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","default":"Pick","options":["Pick","Upload","Upload (a file added)","Upload (picture cards on)","Photos","Camera","Record","Recording","Paused","Paste","Paste (a language set)","Paste (language list)","YouTube","YouTube transcript","Topic","More from a source","Making","Making a recording","Review","Review (notes open)","Review (notes off)","Review (no room for notes)","Review (audio cards)","Review (picture cards)","Review (editing a card)","Limit reached","File too big","Error"]},"$preview":{"width":1440,"height":900}}'>
class Component extends LucidaLogic(DCLogic, 0) {
renderVals() { return { yes: true, step: this.props.step || 'Pick' }; }
}
</script>
</body>
</html>
