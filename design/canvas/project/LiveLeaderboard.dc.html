<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live · big screen · leaderboard</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");
@keyframes scTimer{from{stroke-dashoffset:0}to{stroke-dashoffset:1}}@keyframes scTime{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes scJoin{from{opacity:0;transform:scale(.6)}}@keyframes scBar{from{transform:scaleX(0)}}@keyframes scRiseUp{from{opacity:0;transform:translateY(40px)}}@keyframes scFloat2{50%{transform:translateY(-6px)}}@keyframes scPop{from{transform:scale(0)}}@keyframes scDealR{from{opacity:0;transform:translate(40px,30px)}}@keyframes scDealL{from{opacity:0;transform:translate(-30px,30px)}}@keyframes scLiftIn{from{transform:none}to{transform:translateY(-10px)}}@keyframes scHover{from{transform:translateY(-10px)}to{transform:translateY(-15px)}}@media (prefers-reduced-motion:reduce){.sc-occ{transition:none!important}}@media (prefers-reduced-motion:reduce){.sc-live *{animation:none!important}}
</style>
</helmet>
<div class="sc-live" style="position: relative; isolation: isolate; width: 1440px; height: 900px; box-sizing: border-box; font-family: Geist, -apple-system, system-ui, sans-serif; background: #7ACFEA; color: #0D1542; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF;">
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: {{t.bg}};">
  <sc-if value="{{bg.isDeck}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; inset: -4%; background: {{bg.mesh.base}}; filter: {{bg.filter}};"><svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" style="position: absolute; inset: 0; pointer-events: none;"><defs><filter id="{{bg.mesh.fid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="{{bg.mesh.disp}}" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="{{bg.mesh.blur}}"/></filter><filter id="{{bg.mesh.sid}}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="{{bg.mesh.sblur}}"/></filter></defs><g filter="url(#{{bg.mesh.fid}})"><ellipse cx="{{bg.mesh.b0.x}}" cy="{{bg.mesh.b0.y}}" rx="{{bg.mesh.b0.rx}}" ry="{{bg.mesh.b0.ry}}" fill="{{bg.mesh.b0.c}}" transform="rotate({{bg.mesh.b0.r}} {{bg.mesh.b0.x}} {{bg.mesh.b0.y}})"/><ellipse cx="{{bg.mesh.b1.x}}" cy="{{bg.mesh.b1.y}}" rx="{{bg.mesh.b1.rx}}" ry="{{bg.mesh.b1.ry}}" fill="{{bg.mesh.b1.c}}" transform="rotate({{bg.mesh.b1.r}} {{bg.mesh.b1.x}} {{bg.mesh.b1.y}})"/><ellipse cx="{{bg.mesh.b2.x}}" cy="{{bg.mesh.b2.y}}" rx="{{bg.mesh.b2.rx}}" ry="{{bg.mesh.b2.ry}}" fill="{{bg.mesh.b2.c}}" transform="rotate({{bg.mesh.b2.r}} {{bg.mesh.b2.x}} {{bg.mesh.b2.y}})"/><ellipse cx="{{bg.mesh.b3.x}}" cy="{{bg.mesh.b3.y}}" rx="{{bg.mesh.b3.rx}}" ry="{{bg.mesh.b3.ry}}" fill="{{bg.mesh.b3.c}}" transform="rotate({{bg.mesh.b3.r}} {{bg.mesh.b3.x}} {{bg.mesh.b3.y}})"/><ellipse cx="{{bg.mesh.b4.x}}" cy="{{bg.mesh.b4.y}}" rx="{{bg.mesh.b4.rx}}" ry="{{bg.mesh.b4.ry}}" fill="{{bg.mesh.b4.c}}" transform="rotate({{bg.mesh.b4.r}} {{bg.mesh.b4.x}} {{bg.mesh.b4.y}})"/><ellipse cx="{{bg.mesh.b5.x}}" cy="{{bg.mesh.b5.y}}" rx="{{bg.mesh.b5.rx}}" ry="{{bg.mesh.b5.ry}}" fill="{{bg.mesh.b5.c}}" transform="rotate({{bg.mesh.b5.r}} {{bg.mesh.b5.x}} {{bg.mesh.b5.y}})"/></g><g filter="url(#{{bg.mesh.sid}})"><ellipse cx="{{bg.mesh.s0.x}}" cy="{{bg.mesh.s0.y}}" rx="{{bg.mesh.s0.rx}}" ry="{{bg.mesh.s0.ry}}" fill="{{bg.mesh.s0.c}}" transform="rotate({{bg.mesh.s0.r}} {{bg.mesh.s0.x}} {{bg.mesh.s0.y}})"/><ellipse cx="{{bg.mesh.s1.x}}" cy="{{bg.mesh.s1.y}}" rx="{{bg.mesh.s1.rx}}" ry="{{bg.mesh.s1.ry}}" fill="{{bg.mesh.s1.c}}" transform="rotate({{bg.mesh.s1.r}} {{bg.mesh.s1.x}} {{bg.mesh.s1.y}})"/></g></svg></div></sc-if>
  <sc-if value="{{bg.isPhoto}}" hint-placeholder-val="{{ false }}"><img src="{{bg.photo}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;"></sc-if>
  <sc-if value="{{bg.isSky}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; right: 0; top: 0; height: 700px; background: linear-gradient(180deg, {{bg.skyTop}} 0%, {{bg.skyMid}} 30%, {{bg.skyLow}} 55%, {{t.bg}} 100%);"></div></sc-if>
  <sc-if value="{{bg.isSunset}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; background: {{bg.sunset}};"></div></sc-if>
  <sc-if value="{{bg.skin}}" hint-placeholder-val="{{ false }}"><div ref="{{bg.art}}" data-sc-own style="position: absolute; inset: 0; overflow: hidden;"></div></sc-if>
  <div style="position: absolute; inset: 0; background: {{bg.veil}};"></div>
  <svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; mix-blend-mode: overlay; opacity: {{bg.grain}}; pointer-events: none;"><filter id="sc-study-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="3.4" intercept="-1.2"/><feFuncG type="linear" slope="3.4" intercept="-1.2"/><feFuncB type="linear" slope="3.4" intercept="-1.2"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(#sc-study-grain)"/></svg>
</div>
  <header style="height: 96px; flex-shrink: 0; box-sizing: border-box; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
    <div style="display: flex; align-items: center; gap: 16px; min-width: 0;"><div style="display: flex; align-items: center; gap: 9px;"><svg width="16" height="15" viewBox="0 0 33 30.5" fill="currentColor" aria-hidden="true" style="flex-shrink: 0; display: block;"><circle cx="7" cy="7" r="7"/><circle cx="26" cy="7" r="7"/><circle cx="16.5" cy="23.45" r="7"/></svg><div style="font-size: 17px; font-weight: 600; letter-spacing: -.02em;">Lucida</div></div><span style="height: 32px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; background: rgba(255,255,255,.55); font-size: 14px; font-weight: 600; white-space: nowrap;"><span>{{qOf}}</span></span><span style="min-width: 0; font-size: 15px; color: rgba(13,21,66,.68); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{deckName}}</span></div>
    <a href="LiveQuestion.dc.html" onClick="{{next}}" data-key="Enter" style="height: 52px; padding: 0 26px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; background: #0D1542; color: #FFFFFF; font-size: 16px; font-weight: 600; ">Next question<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>
  </header>
  <main style="flex-grow: 1; box-sizing: border-box; padding: 16px 48px 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;">
    <h1 style="margin: 0; font-size: 60px; font-weight: 700; letter-spacing: -.035em;">Leaderboard</h1>
    <div style="width: 900px; max-width: 100%; display: flex; flex-direction: column; gap: 12px;"><sc-for list="{{board}}" as="p" hint-placeholder-count="5"><div style="height: 72px; box-sizing: border-box; padding: 0 22px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 10px 24px -16px rgba(13,21,66,.35); display: flex; align-items: center; gap: 18px; animation: scRiseUp .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: {{p.delay}};"><span style="width: 32px; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: rgba(13,21,66,.68);">{{p.rank}}</span><span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: {{p.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;">{{p.initial}}</span><span style="width: 190px; font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.name}}</span><div style="flex-grow: 1; height: 12px; border-radius: 6px; background: rgba(13,21,66,.08); overflow: hidden;"><div style="width: {{p.w}}; height: 100%; border-radius: 6px; background: #4F60E6; transform-origin: left; animation: scBar .9s cubic-bezier(.2,.8,.2,1) both;"></div></div><span style="width: 90px; text-align: right; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;">{{p.score}}</span><span style="width: 44px; text-align: right; font-size: 15px; font-weight: 700; color: {{p.moveColor}};">{{p.move}}</span></div></sc-for></div>
  </main>
  <footer style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; color: rgba(13,21,66,.68);"><span>Join at <span style="font-weight: 700; color: #0D1542;">{{joinText}}</span> with <span style="font-weight: 700; color: #0D1542; letter-spacing: .06em;">{{codeShown}}</span></span><span>{{peopleLine}}</span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"grain":{"editor":"range","default":0.7,"min":0,"max":1,"step":0.05},"$preview":{"width":1440,"height":900}}'>
class Component extends LucidaLogic(DCLogic, 0) {

renderVals() {
  const t = this.theme(false, false), db = this.props.db || this.mock();
  const bgKindOf = (b, img, S) => {
    const k = b && ['deck', 'plain', 'sky', 'sunset', 'photo'].includes(b.kind) && !(b.kind === 'photo' && !img) ? b.kind : '';
    return k && (k !== 'deck' || b.chosen) ? k : S ? 'deck' : 'plain';
  };
  const studyBg = (dk, dark, dim, S, phone) => {
    const b = (dk && dk.bg) || {}, img = b.image || (dk && dk.image) || '';
    const kind = bgKindOf(b, img, S);
    const mesh = this.gen(((dk && dk.seed) || 'Lucida') + (dk && dk.round ? ' #' + dk.round : ''), (dk && dk.style) || 'mix');
    const skin = !!S && kind === 'deck';
    // On the canvas a photo is a placeholder, so it shows the deck's colors at full strength instead.
    const photo = kind === 'photo' && img !== 'mock' ? img : '', sample = kind === 'photo' && !photo, faint = kind === 'deck' && !skin, gray = dark && dim;
    // In light mode the deck's colors are one pale hue (the owner: "make the background for flashcards and learn be
    // monochrome and lighter/fainter on light mode"): every fold of its gradient in the deck's main color (the middle of
    // the gradient), light and soft, a pastel wash under the words. Dark and gray keep theirs.
    const mono = faint && !dark, hue = parseInt(mesh.base.split('hsl(')[2]) || 0;
    const pale = c => c.replace(/hsl\((\d+) (\d+)% (\d+)%\)/g, (_, h, s, l) => 'hsl(' + hue + ' 50% ' + Math.round(84 + l * .12) + '%)');
    return { isDeck: faint || sample, isPhoto: !!photo, isSky: kind === 'sky', isSunset: kind === 'sunset', isPlain: kind === 'plain', photo, skin, art: skin ? S.bg(!!phone) : null, dark: skin ? S.dark : dark,
      mesh: mono ? Object.fromEntries(Object.entries(mesh).map(([k, v]) => [k, typeof v === 'string' ? pale(v) : v && v.c ? { ...v, c: pale(v.c) } : v])) : mesh,
      filter: sample || !dark ? 'none' : gray ? 'saturate(.16) brightness(.34)' : 'saturate(.16) brightness(.42)',
      veil: faint ? (gray ? 'rgba(30,30,32,.45)' : dark ? 'rgba(0,0,0,.3)' : 'rgba(255,255,255,.35)') : photo || sample ? (gray ? 'rgba(30,30,32,.55)' : dark ? 'rgba(0,0,0,.5)' : 'rgba(255,255,255,.38)') : 'rgba(0,0,0,0)',
      skyTop: gray ? '#1B2A48' : dark ? '#081733' : '#86BDF3', skyMid: gray ? '#1F2B45' : dark ? '#0D2148' : '#C9E2FB', skyLow: gray ? '#212637' : dark ? '#0A1530' : '#EDF5FE',
      sunset: gray ? "radial-gradient(90% 60% at 88% 100%, rgba(238,142,98,.18), rgba(238,142,98,0) 70%), linear-gradient(180deg, #1F2638 0%, #272C40 35%, #332C3F 65%, #3E2E37 100%)" : dark ? "radial-gradient(90% 60% at 88% 100%, rgba(238,142,98,.16), rgba(238,142,98,0) 70%), linear-gradient(180deg, #0C1426 0%, #151B31 35%, #231C2E 65%, #2E1D25 100%)" : "radial-gradient(90% 60% at 88% 100%, rgba(238,142,98,.22), rgba(238,142,98,0) 70%), linear-gradient(180deg, #C3D3E3 0%, #D3DBE6 30%, #E6DDE4 52%, #F2DCD8 72%, #F5CFC2 100%)", grain: faint || sample || kind === 'sunset' ? '.55' : '0' };
  };
  const occView = (boxes, ask, mode, shown, c) => (boxes || []).map((b, i) => {
    const asked = i === ask, hide = asked || mode === 'all', pct = v => +(v * 100).toFixed(3) + '%';
    return { n: hide ? String(i + 1) : '', x: pct(b.x), y: pct(b.y), w: pct(b.w), h: pct(b.h), z: asked ? '2' : '1',
      bg: asked ? (shown ? 'transparent' : '#FFD60A') : hide ? '#FFD60A' : 'transparent', fg: asked ? (shown ? 'transparent' : '#000000') : 'rgba(0,0,0,.6)',
      ring: asked ? 'inset 0 0 0 2.5px ' + c.edge + ', 0 0 0 2px ' + c.ring : hide ? '0 0 0 2px ' + c.ring : 'none',
      // Only showing the answer fades; covering a new card's box is instant, so its answer never shows through.
      tr: asked && shown ? 'background-color .45s cubic-bezier(.2,.8,.2,1), color .3s ease' : 'none' };
  });
  const LVc = {"blue":"#7ACFEA","green":"#62DE8A","yellow":"#FFD84A","navy":"#0D1542","ink2":"rgba(13,21,66,.68)","chip":"rgba(255,255,255,.55)","check":"#16C64A","gray":"#C4CBD5","grayInk":"#5D6677","purple":"#4F60E6","shadow":"0 10px 24px -16px rgba(13,21,66,.35)","lift":"0 26px 48px -20px rgba(13,21,66,.5)"}, VIVID = ["Live answer 9","Live answer 86","Live answer 34","Live answer 5"], colors = ["#4F60E6","#F2701D","#12A150","#E5407E","#0D1542"];
  const L = db.live() || { code: '', codeShown: '', joinText: '', qr: '', deck: { name: '', seed: 'Lucida', style: 'mix', round: 0, bg: { kind: 'deck', image: null } }, phase: 'lobby', people: [], here: 0, n: 0, of: 0, q: null, answered: 0, playing: 0, got: 0, timer: { left: 0, dur: 20, delay: 0, frac: 0 }, board: [], last: false, status: '' };
  const q = L.q || { text: '', options: [], right: null, counts: null, image: '', occ: null }, reveal = q.right != null;
  const people = n => n === 1 ? '1 person' : n + ' people';
  const act = fn => e => { if (db.mock) return; if (e && e.preventDefault) e.preventDefault(); fn(); };
  // Each answer's vivid gradient; after the reveal the right one lifts and the others gray out. Long answers get smaller.
  const long = Math.max(0, ...q.options.map(o => String(o).length)), pic = !!q.image;
  const opt = i => { const show = i < q.options.length, lift = reveal && i === q.right, gray = reveal && !lift, p = this.gen(VIVID[i], 'vivid');
    return { i, p, show, label: show ? q.options[i] : '', count: String(((q.counts || [])[i]) || 0), right: lift, showCount: reveal, gfilter: gray ? 'grayscale(1)' : 'none', fg: p.ink, ts: p.shadow,
      badge: p.glass, badgeLine: 'inset 0 0 0 1.5px ' + p.glassLine, shadow: lift ? LVc.lift : gray ? 'none' : LVc.shadow, tf: lift ? 'translateY(-10px)' : 'none', anim: lift ? 'scLiftIn .45s cubic-bezier(.2,.8,.2,1) 0.1s both, scHover 2.4s ease-in-out 0.55s infinite alternate' : 'none' }; };
  const board = L.board, top = board.length ? Math.max(1, board[0].score) : 1, first = board[0];
  // The podium: second, first, and third, as many as played.
  const places = [1, 0, 2].filter(i => board[i]).map(i => { const p = board[i];
    return { place: String(i + 1), name: p.name, initial: (p.name[0] || '?').toUpperCase(), color: colors[p.color % 5], score: p.score.toLocaleString('en-US'), h: [320, 230, 170][i] + 'px',
      bg: [LVc.navy, LVc.purple, LVc.blue][i], fg: i === 2 ? LVc.navy : '#FFFFFF', delay: [.8, .4, 0][i] + 's' }; });
  const dur = L.timer.dur, some = L.people.length > 0;
  return { t, bg: studyBg(L.deck, false, false), grain: String(this.props.grain ?? 0.7),
    deckName: L.deck.name, codeShown: L.codeShown, joinText: L.joinText, qr: L.qr,
    peopleN: String(L.people.length), peopleIn: L.people.length === 1 ? 'person in' : 'people in', peopleLine: L.status ? 'Reconnecting…' : people(L.here),
    people: L.people.map((p, i) => ({ name: p.name, initial: (p.name[0] || '?').toUpperCase(), color: colors[p.color % 5], delay: db.mock ? (i * .12).toFixed(2) + 's' : '0s' })),
    startOp: some ? '1' : '.4', startCursor: some ? 'pointer' : 'default', start: act(() => db.act.liveStart()),
    qOf: 'Question ' + L.n + ' of ' + L.of, qText: q.text,
    qSize: (pic ? Math.min(40, q.text.length > 90 ? 32 : 40) : q.text.length > 160 ? 36 : q.text.length > 90 ? 46 : 60) + 'px', mainGap: pic ? '22px' : '40px',
    tileH: (pic ? 112 : 150) + 'px', tileFs: (long > 70 ? 22 : long > 40 ? 27 : 34) + 'px',
    o0: opt(0), o1: opt(1), o2: opt(2), o3: opt(3),
    pic: { has: pic, mock: q.image === 'mock', url: pic && q.image !== 'mock' ? q.image : '', inset: q.image === 'mock' ? '14px 20px' : '0',
      boxes: pic && q.occ ? occView(q.occ.boxes, q.occ.ask, q.occ.mode, reveal, { edge: LVc.navy, ring: '#FFFFFF' }) : [] },
    answered: String(L.answered), answeredOf: 'of ' + L.playing + ' answered', gotText: L.got + ' of ' + L.playing,
    timer: { left: String(L.timer.left), frac: String(L.timer.frac), label: L.timer.left + ' seconds left', anim: db.mock ? 'scTimer ' + dur + 's linear infinite' : 'scTimer ' + dur + 's linear ' + L.timer.delay + 's both' },
    nextLabel: L.last ? 'Final results' : 'Leaderboard', nextHref: L.last ? 'LivePodium.dc.html' : 'LiveLeaderboard.dc.html', next: act(() => db.act.liveNext()),
    board: board.slice(0, 5).map((p, i) => ({ rank: String(i + 1), name: p.name, initial: (p.name[0] || '?').toUpperCase(), color: colors[p.color % 5], score: p.score.toLocaleString('en-US'), w: Math.max(0, p.score) / top * 100 + '%',
      move: p.move > 0 ? '▲ ' + p.move : p.move < 0 ? '▼ ' + -p.move : p.move === 0 ? '–' : '', moveColor: p.move > 0 ? '#12A150' : p.move < 0 ? '#D92D20' : LVc.grayInk, delay: (i * .08).toFixed(2) + 's' })),
    podium: places, winLine: first ? first.name + ' wins!' : 'Nobody played', endLine: L.deck.name + ' · final results',
    again: act(() => db.act.liveAgain()), done: act(() => db.act.liveClose()),
    // A game made from a topic can be kept as a deck once it is over (the canvas shows it by the board's "topicState" setting).
    ...(() => { const TS = db.mock ? this.props.topicState || 'A deck' : '', lt = db.mock ? { saving: false, error: '' } : db.liveTopic(), tp = L.topic || (TS === 'A topic' ? { name: 'The French Revolution', saved: '' } : TS === 'A topic (saved)' ? { name: 'The French Revolution', saved: 'x' } : null);
      return { topicSave: !!tp && !tp.saved, saveLabel: lt.saving ? 'Saving…' : 'Save as a deck', saveTopic: act(() => db.act.saveLiveTopic()), topicSaved: !!tp && !!tp.saved, savedHref: tp && tp.saved ? '/deck/' + tp.saved : 'WebDeck.dc.html', saveError: lt.error || '' }; })() };
}
}
</script>
</body>
</html>
