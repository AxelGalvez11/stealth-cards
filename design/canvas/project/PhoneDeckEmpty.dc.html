<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone · Deck page · a new deck, nothing in it yet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lucida.css">
<script src="./lucida-logic.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@import url("./lucida.css");

</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden;"><dc-import name="PhoneDeck" empty="{{yes}}" menu="{{menu}}" dark="{{dark}}" dim="{{dim}}" grain="{{grain}}" hint-size="390px,844px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"grain":{"editor":"range","default":0.7,"min":0,"max":1,"step":0.05},"menu":{"editor":"enum","default":"","options":["","Add"]},"$preview":{"width":390,"height":844}}'>
class Component extends LucidaLogic(DCLogic, 0) {
renderVals() { return { yes: true, menu: this.props.menu || '', dark: !!this.props.dark, dim: !!this.props.dim, grain: String(this.props.grain ?? 0.7) }; }
}
</script>
</body>
</html>
